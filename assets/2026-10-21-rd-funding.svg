<title id="title">Federal and business shares of U.S. research and development funding, 1953 to 2023</title>
<desc id="desc">Two lines. The federal government paid for about two-thirds of U.S. R&amp;D in the early 1960s and 18 percent in 2023; business paid for under a third in 1964 and 76 percent in 2023. The lines cross around 1980.</desc>

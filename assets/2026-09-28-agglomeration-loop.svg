<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">The self-reinforcing loop of a manufacturing cluster</title>
  <desc id="desc">Four boxes arranged in a circle connected by clockwise arrows: more suppliers, more buyers, more workers, more factories, and back to more suppliers.</desc>
  <rect width="900" height="760" fill="#ffffff"/>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#52749a"/></marker></defs>

  <!-- top -->
  <rect x="290" y="40" width="320" height="110" fill="#041e42"/>
  <text x="450" y="106" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">MORE SUPPLIERS</text>

  <!-- right -->
  <rect x="560" y="325" width="300" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="710" y="391" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">MORE BUYERS</text>

  <!-- bottom -->
  <rect x="290" y="610" width="320" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="450" y="676" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">MORE FACTORIES</text>

  <!-- left -->
  <rect x="40" y="325" width="300" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="190" y="391" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">MORE WORKERS</text>

  <!-- clockwise arrows -->
  <path d="M620 110 C 720 140, 760 220, 730 315" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 445 C 720 540, 660 600, 620 640" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M280 650 C 180 620, 120 540, 170 445" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M210 315 C 180 220, 220 140, 280 110" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <!-- center -->
  <text x="450" y="372" text-anchor="middle" font-size="26" font-weight="600" fill="#8a7a5c" letter-spacing="1.4">FASTER</text>
  <text x="450" y="408" text-anchor="middle" font-size="26" font-weight="600" fill="#8a7a5c" letter-spacing="1.4">AND CHEAPER</text>
</svg>

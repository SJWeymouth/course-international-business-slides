<title id="title">Average monthly U.S. refiner acquisition cost of crude oil, January 1974 to August 2026</title>
<desc id="desc">A line in nominal dollars a barrel. The cost rises from about 13 in early 1979 to 37 in March 1981, doubles from 16 in July 1990 to 33 in October 1990, peaks at 129 in July 2008, and rises from 64 in February 2026 to 105 in May 2026, highlighted.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="sa-title sa-desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="sa-title">The Apple state aid case, 1991 to 2025</title>
  <desc id="sa-desc">Irish tax rulings issued in 1991 and 2007 are followed by the European Commission's 2016 recovery decision of thirteen billion euro, the General Court's annulment of that decision in 2020, the Court of Justice reinstating it in September 2024, and the release of the escrow account to Ireland in 2025.</desc>

  <rect width="1400" height="330" fill="#ffffff"/>

  <rect x="30" y="86" width="404" height="212" fill="#f0ece3"/>
  <rect x="436" y="86" width="934" height="212" fill="#e6ecf3"/>

  <text x="232" y="66" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="1.5" fill="#8a7a5c">THE ARRANGEMENT</text>
  <text x="903" y="66" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="1.5" fill="#1f4e79">THE STATE STRIKES BACK</text>

  <line x1="58" y1="192" x2="1350" y2="192" stroke="#041e42" stroke-width="3"/>
  <polygon points="1350,183 1376,192 1350,201" fill="#041e42"/>

  <g text-anchor="middle">
    <g>
      <circle cx="232" cy="192" r="10" fill="#8a7a5c"/>
      <text x="232" y="158" font-size="23" font-weight="600" fill="#6b7280">1991 · 2007</text>
      <text x="232" y="232" font-size="22" fill="#041e42">Ireland issues two</text>
      <text x="232" y="260" font-size="22" fill="#041e42">tax rulings to Apple</text>
    </g>
    <g>
      <circle cx="580" cy="192" r="10" fill="#1f4e79"/>
      <text x="580" y="158" font-size="23" font-weight="600" fill="#6b7280">2016</text>
      <text x="580" y="232" font-size="22" fill="#041e42">Commission orders</text>
      <text x="580" y="260" font-size="22" fill="#041e42">€13bn recovered</text>
    </g>
    <g>
      <circle cx="850" cy="192" r="10" fill="#7088a4"/>
      <text x="850" y="158" font-size="23" font-weight="600" fill="#6b7280">2020</text>
      <text x="850" y="232" font-size="22" fill="#041e42">General Court</text>
      <text x="850" y="260" font-size="22" fill="#041e42">annuls the decision</text>
    </g>
    <g>
      <circle cx="1105" cy="192" r="10" fill="#1f4e79"/>
      <text x="1105" y="158" font-size="23" font-weight="600" fill="#6b7280">Sept 2024</text>
      <text x="1105" y="232" font-size="22" fill="#041e42">Court of Justice</text>
      <text x="1105" y="260" font-size="22" fill="#041e42">reinstates it</text>
    </g>
    <g>
      <circle cx="1300" cy="192" r="10" fill="#041e42"/>
      <text x="1300" y="158" font-size="23" font-weight="600" fill="#6b7280">2025</text>
      <text x="1300" y="232" font-size="22" fill="#041e42">Escrow released</text>
      <text x="1300" y="260" font-size="22" fill="#041e42">to Ireland</text>
    </g>
  </g>
</svg>

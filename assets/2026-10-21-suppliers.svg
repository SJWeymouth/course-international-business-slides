<text x="323.8" y="90" text-anchor="middle" font-size="30" fill="#5b6672">July 2025</text>
<text x="511.2" y="52" text-anchor="middle" font-size="30" font-weight="600" fill="#1f4e79">Classified</text>
<text x="511.2" y="90" text-anchor="middle" font-size="30" fill="#5b6672">Dec. 2025</text>

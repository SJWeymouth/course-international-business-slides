<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Which AI labs the Pentagon had contracts or platforms with, July 2025 to August 2026</title>
<desc id="desc">A grid of four labs by four dates. All four labs held contracts in July 2025. Only Anthropic was on classified networks in December 2025. By February 2026 OpenAI and xAI had classified deals and Anthropic was being cut off. By August 2026 OpenAI, Google, and xAI were on GenAI.mil and Anthropic was not.</desc>

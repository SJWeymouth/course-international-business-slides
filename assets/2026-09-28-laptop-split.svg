<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="552" viewBox="0 0 1000 552" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Who gets what from a $1,000 laptop, a factory manager's estimate reported by Fallows in 2007</title>
<desc id="desc">Horizontal bars: Intel and Microsoft about 300 dollars; each maker of a screen or disk about 150; the retailer under 50; the factory and its workers 30 to 40; the keyboard maker 15 to 20; FedEx or UPS a bit less.</desc>
<rect width="1000" height="552" fill="#ffffff"/>
<text x="470" y="42" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF A $1,000 PRICE</text>
<text x="454" y="125.0" text-anchor="end" font-size="36" fill="#041e42">Intel and Microsoft</text>
<rect x="470" y="90" width="340.0" height="50" fill="#041e42"/>
<text x="822.0" y="125.0" font-size="36" fill="#5b6672">about $300</text>
<text x="454" y="197.0" text-anchor="end" font-size="36" fill="#041e42">Screen or disk maker, each</text>
<rect x="470" y="162" width="170.0" height="50" fill="#041e42"/>
<text x="652.0" y="197.0" font-size="36" fill="#5b6672">about $150</text>
<text x="454" y="269.0" text-anchor="end" font-size="36" fill="#041e42">The retailer</text>
<rect x="470" y="234" width="56.7" height="50" fill="#041e42"/>
<text x="538.7" y="269.0" font-size="36" fill="#5b6672">under $50</text>
<text x="454" y="341.0" text-anchor="end" font-size="36" fill="#041e42">The factory and its workers</text>
<rect x="470" y="306" width="39.7" height="50" fill="#8a7a5c"/>
<text x="521.7" y="341.0" font-size="36" fill="#5b6672">$30 to $40</text>
<text x="454" y="413.0" text-anchor="end" font-size="36" fill="#041e42">The keyboard maker</text>
<rect x="470" y="378" width="19.8" height="50" fill="#041e42"/>
<text x="501.8" y="413.0" font-size="36" fill="#5b6672">$15 to $20</text>
<text x="454" y="485.0" text-anchor="end" font-size="36" fill="#041e42">FedEx or UPS</text>
<rect x="470" y="450" width="15.9" height="50" fill="#041e42"/>
<text x="497.9" y="485.0" font-size="36" fill="#5b6672">a bit less</text>
<line x1="470" y1="84" x2="470" y2="506" stroke="#5b6672" stroke-width="2"/>
</svg>

<rect x="303" y="510" width="28" height="28" fill="#1f4e79"/><text x="341" y="534" font-size="30" fill="#5b6672">Freight</text>
<rect x="496" y="510" width="28" height="28" fill="#8a7a5c"/><text x="534" y="534" font-size="30" fill="#5b6672">Tariff</text>
<rect x="674" y="510" width="28" height="28" fill="#5b6672"/><text x="712" y="534" font-size="30" fill="#5b6672">Stock in transit</text>

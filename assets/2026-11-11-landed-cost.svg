<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Illustrative landed cost of one product from China, Vietnam, and Mexico, dollars per unit</title>
<desc id="desc">Stacked horizontal bars, illustrative. China: factory price 10.00, freight 0.80, tariff 2.50, stock in transit 0.25, total 13.55. Vietnam: 11.00, 0.90, 2.20, 0.25, total 14.35. Mexico: 13.00, 0.40, 0, 0.05, total 13.45, highlighted as lowest.</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">ILLUSTRATIVE LANDED COST, DOLLARS PER UNIT</text>
<text x="154" y="168" text-anchor="end" font-size="34" fill="#041e42">China</text>
<rect x="170.0" y="120" width="446.7" height="70" fill="#041e42" stroke="#ffffff" stroke-width="2"/>
<rect x="616.7" y="120" width="35.7" height="70" fill="#1f4e79" stroke="#ffffff" stroke-width="2"/>
<rect x="652.4" y="120" width="111.7" height="70" fill="#8a7a5c" stroke="#ffffff" stroke-width="2"/>
<rect x="764.1" y="120" width="11.2" height="70" fill="#5b6672" stroke="#ffffff" stroke-width="2"/>
<text x="789.2" y="168" font-size="34" font-weight="400" fill="#5b6672">$13.55</text>
<text x="154" y="288" text-anchor="end" font-size="34" fill="#041e42">Vietnam</text>
<rect x="170.0" y="240" width="491.3" height="70" fill="#041e42" stroke="#ffffff" stroke-width="2"/>
<rect x="661.3" y="240" width="40.2" height="70" fill="#1f4e79" stroke="#ffffff" stroke-width="2"/>
<rect x="701.5" y="240" width="98.3" height="70" fill="#8a7a5c" stroke="#ffffff" stroke-width="2"/>
<rect x="799.8" y="240" width="11.2" height="70" fill="#5b6672" stroke="#ffffff" stroke-width="2"/>
<text x="825.0" y="288" font-size="34" font-weight="400" fill="#5b6672">$14.35</text>
<text x="154" y="408" text-anchor="end" font-size="34" fill="#041e42">Mexico</text>
<rect x="170.0" y="360" width="580.7" height="70" fill="#041e42" stroke="#ffffff" stroke-width="2"/>
<rect x="750.7" y="360" width="17.9" height="70" fill="#1f4e79" stroke="#ffffff" stroke-width="2"/>
<rect x="768.5" y="360" width="2.2" height="70" fill="#5b6672" stroke="#ffffff" stroke-width="2"/>
<text x="784.8" y="408" font-size="34" font-weight="700" fill="#041e42">$13.45</text>

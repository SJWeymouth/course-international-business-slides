<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">What the shale boom added to the U.S. economy in 2014, by O'Sullivan's sources</title>
<desc id="desc">A table of four rows: added to U.S. GDP, 430 billion dollars, about 2.5 percent of GDP; added to government revenue, 111 billion dollars, a fifth of the defense budget; jobs supported, 2.7 million; oil import bill, 215 billion dollars instead of 360 billion.</desc>
<rect width="1000" height="520" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">THE SHALE BOOM IN 2014</text>
<line x1="10" y1="78" x2="990" y2="78" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="122" font-size="32" fill="#041e42">Added to U.S. GDP</text>
<text x="990" y="122" text-anchor="end" font-size="40" font-weight="700" fill="#041e42">$430 billion</text>
<text x="10" y="162" font-size="28" fill="#5b6672">about 2.5% of GDP</text>
<line x1="10" y1="188" x2="990" y2="188" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="232" font-size="32" fill="#041e42">Added to government revenue</text>
<text x="990" y="232" text-anchor="end" font-size="40" font-weight="700" fill="#8a7a5c">$111 billion</text>
<text x="10" y="272" font-size="28" fill="#5b6672">a fifth of the defense budget</text>
<line x1="10" y1="298" x2="990" y2="298" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="342" font-size="32" fill="#041e42">Jobs supported</text>
<text x="990" y="342" text-anchor="end" font-size="40" font-weight="700" fill="#041e42">2.7 million</text>
<line x1="10" y1="408" x2="990" y2="408" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="452" font-size="32" fill="#041e42">Oil import bill</text>
<text x="990" y="452" text-anchor="end" font-size="40" font-weight="700" fill="#041e42">$215 billion</text>
<text x="10" y="492" font-size="28" fill="#5b6672">instead of $360 billion</text>
<line x1="10" y1="518" x2="990" y2="518" stroke="#cdd9e6" stroke-width="2"/>
</svg>

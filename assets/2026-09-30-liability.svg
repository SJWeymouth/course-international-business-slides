<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Three sources of the liability of foreignness</title>
  <desc id="desc">Three boxes side by side: not knowing the market, not having the relationships, not being seen as local. A bracket beneath reads costs a local rival does not pay.</desc>
  <rect width="1600" height="420" fill="#ffffff"/>
  <g text-anchor="middle">
    <rect x="60" y="60" width="460" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="290" y="120" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">UNFAMILIARITY</text>
    <text x="290" y="170" font-size="30" fill="#041e42">not knowing the market</text>
    <text x="290" y="215" font-size="24" fill="#4a5663">sites, assortment, habits</text>

    <rect x="570" y="60" width="460" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="800" y="120" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">RELATIONSHIPS</text>
    <text x="800" y="170" font-size="30" fill="#041e42">not having the ties</text>
    <text x="800" y="215" font-size="24" fill="#4a5663">unions, suppliers, officials</text>

    <rect x="1080" y="60" width="460" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="1310" y="120" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">LEGITIMACY</text>
    <text x="1310" y="170" font-size="30" fill="#041e42">not being seen as local</text>
    <text x="1310" y="215" font-size="24" fill="#4a5663">shoppers, employees, regulators</text>
  </g>
  <path d="M60 300 V 330 H 1540 V 300" stroke="#8a7a5c" stroke-width="4" fill="none"/>
  <text x="800" y="380" text-anchor="middle" font-size="30" font-weight="700" fill="#8a7a5c">COSTS A LOCAL RIVAL DOES NOT PAY</text>
</svg>

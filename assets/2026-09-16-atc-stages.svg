<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="285" viewBox="0 0 1360 285" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, Helvetica Neue, Arial, sans-serif"><title id="title">ATC integration schedule</title><desc id="desc">The stages integrated products accounting for at least 16 percent, a further 17 percent, a further 18 percent, and the remaining 49 percent of 1990 import volume. This is not a count of quotas removed.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1f4e79"/></marker></defs><text x="40" y="45" font-size="27" fill="#1f4e79" font-weight="600" text-anchor="start">PRODUCTS INTEGRATED INTO GATT RULES</text><text x="40" y="85" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">Share of 1990 import volume in covered products</text><rect x="40" y="115" width="204.8" height="100" fill="#e5ecf3" stroke="white" stroke-width="2"/><text x="142.4" y="178" font-size="34" fill="#041e42" font-weight="600" text-anchor="middle">16%</text><text x="142.4" y="260" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">1995</text><rect x="244.8" y="115" width="217.60000000000002" height="100" fill="#ced9e6" stroke="white" stroke-width="2"/><text x="353.6" y="178" font-size="34" fill="#041e42" font-weight="600" text-anchor="middle">17%</text><text x="353.6" y="260" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">1998</text><rect x="462.40000000000003" y="115" width="230.4" height="100" fill="#a7bdd2" stroke="white" stroke-width="2"/><text x="577.6" y="178" font-size="34" fill="#041e42" font-weight="600" text-anchor="middle">18%</text><text x="577.6" y="260" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">2002</text><rect x="692.8000000000001" y="115" width="627.2" height="100" fill="#041e42" stroke="white" stroke-width="2"/><text x="1006.4000000000001" y="178" font-size="34" fill="white" font-weight="600" text-anchor="middle">49%</text><text x="1006.4000000000001" y="260" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">2005</text></svg>
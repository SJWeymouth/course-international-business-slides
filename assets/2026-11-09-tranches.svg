<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">How mortgages were turned into rated securities</title>
<desc id="desc">Diagram with illustrative sizes. A pool of mortgages feeds a mortgage bond split into three layers: AAA, 80 percent, on top; BBB, 15 percent, in the middle; first loss, 5 percent, at the bottom. An arrow marks that the top layer is paid first and a highlighted arrow that the bottom layer loses first. A second arrow carries BBB layers from many bonds into a CDO, which is split again, with an AAA layer of 80 percent on top.</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="80" y="120" text-anchor="middle" font-size="30" font-weight="700" fill="#041e42">Mortgages</text>

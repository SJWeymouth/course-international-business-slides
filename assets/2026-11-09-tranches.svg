<rect x="60" y="338" width="30" height="30" fill="#5b6672"/><polygon points="57,340 75,324 93,340" fill="#5b6672"/>
<rect x="102" y="338" width="30" height="30" fill="#5b6672"/><polygon points="99,340 117,324 135,340" fill="#5b6672"/>

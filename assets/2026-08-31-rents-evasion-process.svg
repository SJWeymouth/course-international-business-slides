<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">Restrictions, rents, evasion, intermediaries</title>
  <desc id="desc">Four steps in a chain: restrictions lead to rents, rents lead to evasion, evasion relies on intermediaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52749a"/>
    </marker>
  </defs>
  <rect width="1400" height="300" fill="#ffffff"/>
  <path d="M272 150 H398 M602 150 H728 M932 150 H1058" fill="none" stroke="#52749a" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700" font-size="27" fill="#ffffff">
    <g transform="translate(170,150)"><circle r="100" fill="#041e42"/><text y="10">RESTRICTIONS</text></g>
    <g transform="translate(500,150)"><circle r="100" fill="#365f8a"/><text y="10">RENTS</text></g>
    <g transform="translate(830,150)"><circle r="100" fill="#7088a4"/><text y="10">EVASION</text></g>
    <g transform="translate(1160,150)"><circle r="100" fill="#a28e7d"/><text y="-6">INTER-</text><text y="28">MEDIARIES</text></g>
  </g>
</svg>

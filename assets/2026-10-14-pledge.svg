<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="356" viewBox="0 0 1600 356" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Apple's 2016 pledge to invest in China compared with the Marshall Plan and Japan's loans to China, in 2016 dollars</title>
<desc id="desc">Three horizontal bars: Apple's pledge to China, 2016 to 2021, $275 billion (highlighted); the Marshall Plan for sixteen countries, 1948 to 1952, $131 billion; Japan's loans to China, 1979 to 2007, about $30 billion.</desc>
<rect width="1600" height="356" fill="#ffffff"/>
<text x="640" y="56" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">BILLIONS OF 2016 DOLLARS</text>
<text x="624" y="128.08" text-anchor="end" font-size="32" fill="#041e42">Apple's pledge to China, 2016-2021</text>
<rect x="640" y="90" width="700.0" height="56" fill="#8a7a5c"/>
<text x="1354.0" y="128.08" font-size="32" fill="#5b6672">$275 billion</text>
<text x="624" y="210.08" text-anchor="end" font-size="32" fill="#041e42">Marshall Plan, 16 countries, 1948-1952</text>
<rect x="640" y="172" width="333.5" height="56" fill="#041e42"/>
<text x="987.5" y="210.08" font-size="32" fill="#5b6672">$131 billion</text>
<text x="624" y="292.08" text-anchor="end" font-size="32" fill="#041e42">Japan's loans to China, 1979-2007</text>
<rect x="640" y="254" width="76.4" height="56" fill="#041e42"/>
<text x="730.4" y="292.08" font-size="32" fill="#5b6672">about $30 billion</text>
<line x1="640" y1="82" x2="640" y2="318" stroke="#5b6672" stroke-width="2"/>
</svg>

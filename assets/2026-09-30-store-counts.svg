<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Store counts reported in the article, 2006</title>
  <desc id="desc">Horizontal bars: Aldi in Germany 4,100 stores; Wal-Mart in Brazil 295; Wal-Mart in Germany 85; Wal-Mart in China 60; Wal-Mart in South Korea 16. The German and Korean Wal-Mart bars are shaded taupe to mark the two 2006 exits.</desc>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">STORES, AS REPORTED IN AUGUST 2006 · 0.3 PX PER STORE</text>

  <!-- bars start at x=420; scale 0.3 px per store -->
  <g font-size="28" fill="#041e42">
    <text x="400" y="122" text-anchor="end">Aldi, Germany</text>
    <rect x="420" y="92" width="1230" height="46" fill="#041e42"/>
    <text x="1500" y="126" text-anchor="end" font-size="30" font-weight="700" fill="#ffffff">4,100</text>

    <text x="400" y="207" text-anchor="end">Wal-Mart, Brazil</text>
    <rect x="420" y="177" width="89" height="46" fill="#365f91"/>
    <text x="522" y="211" font-size="30" font-weight="700" fill="#041e42">295</text>

    <text x="400" y="292" text-anchor="end">Wal-Mart, Germany</text>
    <rect x="420" y="262" width="26" height="46" fill="#b3a394"/>
    <text x="458" y="296" font-size="30" font-weight="700" fill="#8a7a5c">85 · exit</text>

    <text x="400" y="377" text-anchor="end">Wal-Mart, China</text>
    <rect x="420" y="347" width="18" height="46" fill="#365f91"/>
    <text x="450" y="381" font-size="30" font-weight="700" fill="#041e42">60</text>

    <text x="400" y="462" text-anchor="end">Wal-Mart, South Korea</text>
    <rect x="420" y="432" width="5" height="46" fill="#b3a394"/>
    <text x="437" y="466" font-size="30" font-weight="700" fill="#8a7a5c">16 · exit</text>
  </g>
</svg>

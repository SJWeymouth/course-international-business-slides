<title id="title">A blank grid for the activity: four problems by three capitals and the firm's move</title>
<desc id="desc">A grid for the activity. Rows: 1, a 13-year-old watches five hours of video a day on one app; 2, a post that the government calls false reaches ten million people; 3, a platform wants to buy its fastest-growing rival; 4, a firm wants to store its users' data in another country. Columns: Washington, Beijing, Brussels, and the firm's move. Every cell holds a question mark.</desc>

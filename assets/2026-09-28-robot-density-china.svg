<text x="615.6" y="253.44" font-size="39" fill="#5b6672">470</text>
<text x="374" y="321.44" text-anchor="end" font-size="39" fill="#041e42">Germany 2023</text>
<rect x="390" y="284" width="195.0" height="52" fill="#041e42"/>
<text x="597.0" y="321.44" font-size="39" fill="#5b6672">429</text>

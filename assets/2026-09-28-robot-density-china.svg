<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Industrial robots per 10,000 manufacturing employees: China in 2013, 2016, and 2023 beside Germany, Japan, the United States, and Korea in 2023</title>
<desc id="desc">Horizontal bars: China rises from 25 in 2013 to 68 in 2016 and 470 in 2023, above Germany at 429 and Japan at 419; Korea is 1,012.</desc>
<rect width="1000" height="596" fill="#ffffff"/>
<text x="390" y="42" font-size="35" font-weight="600" letter-spacing="1.2" fill="#1f4e79">ROBOTS PER 10,000 WORKERS</text>
<text x="374" y="117.44" text-anchor="end" font-size="39" fill="#041e42">China 2013</text>
<rect x="390" y="80" width="11.4" height="52" fill="#8a7a5c"/>
<text x="413.4" y="117.44" font-size="39" fill="#5b6672">25</text>
<text x="374" y="185.44" text-anchor="end" font-size="39" fill="#041e42">China 2016</text>
<rect x="390" y="148" width="30.9" height="52" fill="#8a7a5c"/>
<text x="432.9" y="185.44" font-size="39" fill="#5b6672">68</text>
<text x="374" y="253.44" text-anchor="end" font-size="39" fill="#041e42">China 2023</text>

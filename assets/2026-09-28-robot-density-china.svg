<text x="592.5" y="389.44" font-size="39" fill="#5b6672">419</text>
<text x="374" y="457.44" text-anchor="end" font-size="39" fill="#041e42">United States 2023</text>
<rect x="390" y="420" width="134.1" height="52" fill="#041e42"/>
<text x="536.1" y="457.44" font-size="39" fill="#5b6672">295</text>

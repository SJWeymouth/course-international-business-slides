<text x="822.8" y="411.68" font-size="34" fill="#5b6672">26%</text>
<text x="344" y="481.68" text-anchor="end" font-size="34" fill="#041e42">Banking</text>
<rect x="360" y="450" width="183.2" height="44" fill="#041e42"/>

<rect x="360" y="240" width="160.2" height="44" fill="#8a7a5c"/>
<text x="534.2" y="271.68" font-size="34" fill="#5b6672">9%</text>
<text x="344" y="341.68" text-anchor="end" font-size="34" fill="#041e42">Utilities</text>
<rect x="360" y="310" width="111.1" height="44" fill="#8a7a5c"/>

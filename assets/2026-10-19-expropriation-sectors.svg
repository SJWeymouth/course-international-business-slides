<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Share of expropriations of foreign direct investment by sector, 1960 to 2006</title>
<desc id="desc">Horizontal bars of the share of 625 acts: petroleum 18 percent, mining 12, agriculture 9, and utilities 6 (these four highlighted); manufacturing 26, banking and insurance 11, trade 5, transportation 4.</desc>
<rect width="1000" height="660" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF 625 ACTS, 1960 TO 2006</text>
<text x="344" y="131.68" text-anchor="end" font-size="34" fill="#041e42">Petroleum</text>
<rect x="360" y="100" width="316.4" height="44" fill="#8a7a5c"/>
<text x="690.4" y="131.68" font-size="34" fill="#5b6672">18%</text>
<text x="344" y="201.68" text-anchor="end" font-size="34" fill="#041e42">Mining</text>
<rect x="360" y="170" width="216.5" height="44" fill="#8a7a5c"/>
<text x="590.5" y="201.68" font-size="34" fill="#5b6672">12%</text>

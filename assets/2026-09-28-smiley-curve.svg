<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The smiley curve: value added by stage of a product</title>
<desc id="desc">A U-shaped curve. Value added is high for brand, concept, and design at the left, falls through engineering, components, and assembly in the middle, and rises again through shipping, retail, and service at the right. The middle stages, where Chinese factories work, are shaded.</desc>
<rect width="1600" height="620" fill="#ffffff"/>
<rect x="722" y="70" width="304" height="420" fill="#f5f3ef"/>
<text x="874" y="100" text-anchor="middle" font-size="24" font-weight="600" fill="#8a7a5c" letter-spacing="1.2">CHINA</text>
<line x1="120" y1="490" x2="1500" y2="490" stroke="#4a5663" stroke-width="3"/>
<line x1="120" y1="490" x2="120" y2="60" stroke="#4a5663" stroke-width="3"/>
<text x="90" y="88" text-anchor="end" font-size="24" fill="#4a5663">high</text>
<text x="90" y="480" text-anchor="end" font-size="24" fill="#4a5663">low</text>
<text x="40" y="280" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" transform="rotate(-90 40 280)">VALUE ADDED</text>
<path d="M190,109 C215,115 291,132 342,147 C393,162 443,177 494,196 C545,215 595,236 646,261 C697,286 747,325 798,348 C849,372 899,400 950,402 C1001,403 1051,390 1102,356 C1153,322 1203,234 1254,196 C1305,158 1381,139 1406,128" fill="none" stroke="#041e42" stroke-width="8" stroke-linecap="round"/>
<circle cx="190" cy="109" r="12" fill="#041e42"/>
<text x="190" y="532" text-anchor="middle" font-size="26" fill="#041e42">Brand</text>
<circle cx="342" cy="147" r="12" fill="#041e42"/>
<text x="342" y="532" text-anchor="middle" font-size="26" fill="#041e42">Concept</text>
<circle cx="494" cy="196" r="12" fill="#041e42"/>
<text x="494" y="532" text-anchor="middle" font-size="26" fill="#041e42">Design</text>
<circle cx="646" cy="261" r="12" fill="#041e42"/>
<text x="646" y="532" text-anchor="middle" font-size="24" fill="#041e42">Engineering</text>
<circle cx="798" cy="348" r="12" fill="#041e42"/>
<text x="798" y="532" text-anchor="middle" font-size="24" fill="#041e42">Components</text>
<circle cx="950" cy="402" r="12" fill="#041e42"/>
<text x="950" y="532" text-anchor="middle" font-size="26" fill="#041e42">Assembly</text>
<circle cx="1102" cy="356" r="12" fill="#041e42"/>
<text x="1102" y="532" text-anchor="middle" font-size="26" fill="#041e42">Shipping</text>
<circle cx="1254" cy="196" r="12" fill="#041e42"/>
<text x="1254" y="532" text-anchor="middle" font-size="26" fill="#041e42">Retail</text>
<circle cx="1406" cy="128" r="12" fill="#041e42"/>
<text x="1406" y="532" text-anchor="middle" font-size="26" fill="#041e42">Service</text>
<text x="190" y="570" text-anchor="middle" font-size="24" font-weight="600" fill="#1f4e79" letter-spacing="1">BUYER'S HOME</text>
<text x="1406" y="570" text-anchor="middle" font-size="24" font-weight="600" fill="#1f4e79" letter-spacing="1">BUYER'S HOME</text>
</svg>
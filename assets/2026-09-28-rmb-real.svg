<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Nominal and real effective exchange rates of the renminbi, 2000 to 2025, indexed to 2005 = 100</title>
<desc id="desc">Two lines from 100 in 2005: the real rate rises to 153 in 2015, holds near 150 to 2022, and falls to 130 by 2025; the nominal rate rises to 143 in 2015 and stays near 142 in 2025.</desc>

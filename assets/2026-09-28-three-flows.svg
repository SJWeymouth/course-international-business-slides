<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Three flows converge on Shenzhen</title>
  <desc id="desc">Workers from the countryside, entrepreneurs from Taiwan, and buyers from high-wage countries flow into Shenzhen. Products flow out to the world.</desc>
  <rect width="1600" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#52749a"/></marker>
    <marker id="arrow-navy" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#041e42"/></marker>
  </defs>

  <!-- left column: three sources -->
  <g>
    <rect x="60" y="60" width="380" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="250" y="105" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">WORKERS</text>
    <text x="250" y="145" text-anchor="middle" font-size="27" fill="#041e42">from the countryside</text>

    <rect x="60" y="225" width="380" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="250" y="270" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">ENTREPRENEURS</text>
    <text x="250" y="310" text-anchor="middle" font-size="27" fill="#041e42">mainly from Taiwan</text>

    <rect x="60" y="390" width="380" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
    <text x="250" y="435" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">BUYERS</text>
    <text x="250" y="475" text-anchor="middle" font-size="27" fill="#041e42">from high-wage countries</text>
  </g>

  <!-- arrows into Shenzhen -->
  <path d="M445 115 C 560 115, 600 240, 690 265" stroke="#52749a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M445 280 L 690 280" stroke="#52749a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M445 445 C 560 445, 600 320, 690 295" stroke="#52749a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Shenzhen -->
  <rect x="705" y="185" width="330" height="190" fill="#041e42"/>
  <text x="870" y="268" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">SHENZHEN</text>
  <text x="870" y="318" text-anchor="middle" font-size="26" fill="#cdd9e6">factories and dormitories</text>

  <!-- intermediary tag -->
  <rect x="705" y="400" width="330" height="70" fill="#ffffff" stroke="#8a7a5c" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="870" y="445" text-anchor="middle" font-size="26" fill="#8a7a5c" font-weight="600" letter-spacing="1">INTERMEDIARIES</text>

  <!-- arrow out -->
  <path d="M1045 280 L 1180 280" stroke="#041e42" stroke-width="7" fill="none" marker-end="url(#arrow-navy)"/>

  <!-- world -->
  <rect x="1195" y="200" width="345" height="160" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="1367" y="265" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">PRODUCTS OUT</text>
  <text x="1367" y="310" text-anchor="middle" font-size="27" fill="#041e42">one container a second</text>
</svg>

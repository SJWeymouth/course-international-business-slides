<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Outcomes of about 1,050 concluded investor-state treaty cases, 1987 to 2024</title>
<desc id="desc">Horizontal bars: decided for the state 38 percent; decided for the investor with damages 29 percent (highlighted); settled 17 percent; discontinued 14 percent; breach found but no damages 2 percent.</desc>
<rect width="1600" height="410" fill="#ffffff"/>
<text x="640" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF CONCLUDED CASES, %</text>
<text x="624" y="121.68" text-anchor="end" font-size="31" fill="#041e42">Decided for the state</text>
<rect x="640" y="90" width="760.0" height="44" fill="#041e42"/>
<text x="1414.0" y="121.68" font-size="31" fill="#5b6672">38%</text>
<text x="624" y="185.68" text-anchor="end" font-size="31" fill="#041e42">Decided for the investor, with damages</text>
<rect x="640" y="154" width="580.0" height="44" fill="#8a7a5c"/>
<text x="1234.0" y="185.68" font-size="31" fill="#5b6672">29%</text>
<text x="624" y="249.68" text-anchor="end" font-size="31" fill="#041e42">Settled</text>
<rect x="640" y="218" width="340.0" height="44" fill="#041e42"/>
<text x="994.0" y="249.68" font-size="31" fill="#5b6672">17%</text>
<text x="624" y="313.68" text-anchor="end" font-size="31" fill="#041e42">Discontinued</text>
<rect x="640" y="282" width="280.0" height="44" fill="#041e42"/>
<text x="934.0" y="313.68" font-size="31" fill="#5b6672">14%</text>
<text x="624" y="377.68" text-anchor="end" font-size="31" fill="#041e42">Breach found, no damages</text>
<rect x="640" y="346" width="40.0" height="44" fill="#041e42"/>
<text x="694.0" y="377.68" font-size="31" fill="#5b6672">2%</text>
<line x1="640" y1="82" x2="640" y2="398" stroke="#5b6672" stroke-width="2"/>
</svg>

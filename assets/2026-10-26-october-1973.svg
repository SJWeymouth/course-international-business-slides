<svg xmlns="http://www.w3.org/2000/svg" width="900" height="534" viewBox="0 0 900 534" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Timeline of October 1973</title>
<desc id="desc">A vertical timeline: October 6, Egypt and Syria attack Israel; October 14, the U.S. airlift lands in daylight; October 16, Gulf producers raise the price 70 percent; October 17, Arab output is cut 5 percent a month; October 19, the United States proposes 2.2 billion dollars in aid to Israel; October 20, Saudi Arabia cuts off the United States (highlighted).</desc>
<rect width="900" height="534" fill="#ffffff"/>
<line x1="26" y1="40" x2="26" y2="460" stroke="#cdd9e6" stroke-width="8"/>
<circle cx="26" cy="40" r="16" fill="#041e42"/>
<text x="64" y="51" font-size="35" font-weight="700" fill="#041e42">Oct. 6</text>
<text x="222" y="52" font-size="34" fill="#5b6672">Egypt and Syria attack Israel</text>
<circle cx="26" cy="124" r="16" fill="#041e42"/>
<text x="64" y="135" font-size="35" font-weight="700" fill="#041e42">Oct. 14</text>
<text x="222" y="136" font-size="34" fill="#5b6672">U.S. airlift lands in daylight</text>
<circle cx="26" cy="208" r="16" fill="#041e42"/>
<text x="64" y="219" font-size="35" font-weight="700" fill="#041e42">Oct. 16</text>
<text x="222" y="220" font-size="34" fill="#5b6672">Gulf producers raise price 70%</text>
<circle cx="26" cy="292" r="16" fill="#041e42"/>
<text x="64" y="303" font-size="35" font-weight="700" fill="#041e42">Oct. 17</text>
<text x="222" y="304" font-size="34" fill="#5b6672">Arab output cut 5% a month</text>
<circle cx="26" cy="376" r="16" fill="#041e42"/>
<text x="64" y="387" font-size="35" font-weight="700" fill="#041e42">Oct. 19</text>
<text x="222" y="388" font-size="34" fill="#5b6672">U.S. proposes $2.2 billion aid</text>
<circle cx="26" cy="460" r="16" fill="#8a7a5c"/>
<text x="64" y="471" font-size="35" font-weight="700" fill="#8a7a5c">Oct. 20</text>
<text x="222" y="472" font-size="34" fill="#5b6672">Saudi Arabia cuts off the U.S.</text>
</svg>

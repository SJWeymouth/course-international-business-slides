<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="275" viewBox="0 0 1400 275" role="img" font-family="Arial, Helvetica, sans-serif"><title>One product moves from manufacturer to distributor to customer</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#365f91" /></marker></defs><text x="700" y="30" font-size="26" fill="#041e42" font-weight="600" text-anchor="middle">ONE PARENT COMPANY OWNS BOTH THE MANUFACTURER AND DISTRIBUTOR</text><rect x="20" y="110" width="410" height="155" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2" /><text x="42" y="150" font-size="27" fill="#041e42" font-weight="600" text-anchor="start">MANUFACTURER</text><text x="42" y="197" font-size="28" fill="#041e42" font-weight="400" text-anchor="start">Makes product for $60</text><text x="42" y="240" font-size="28" fill="#041e42" font-weight="400" text-anchor="start">Country C: 30% tax</text><rect x="530" y="110" width="410" height="155" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2" /><text x="552" y="150" font-size="27" fill="#041e42" font-weight="600" text-anchor="start">DISTRIBUTOR</text><text x="552" y="197" font-size="28" fill="#041e42" font-weight="400" text-anchor="start">Buys from manufacturer</text><text x="552" y="240" font-size="28" fill="#041e42" font-weight="400" text-anchor="start">Country D: 10% tax</text><rect x="1080" y="110" width="300" height="155" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2" /><text x="1102" y="150" font-size="27" fill="#041e42" font-weight="600" text-anchor="start">CUSTOMER</text><text x="1102" y="197" font-size="28" fill="#041e42" font-weight="400" text-anchor="start">Pays $100</text><path d="M430 178 L510 178" stroke="#365f91" stroke-width="4" marker-end="url(#arrow)" /><path d="M940 178 L1060 178" stroke="#365f91" stroke-width="4" marker-end="url(#arrow)" /><text x="465" y="80" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">Internal price: $80 or $70</text><text x="1005" y="80" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">Sells for $100</text></svg>

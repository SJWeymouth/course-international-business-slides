<title id="title">U.S. crude oil production and net petroleum imports, 1950 to 1974</title>
<desc id="desc">Two lines in million barrels a day. U.S. crude production rises from 5.4 in 1950 to a peak of 9.6 in 1970 and then falls to 8.8 in 1974. Net imports rise from 0.5 in 1950 to 3.2 in 1970 and 6.0 in 1973.</desc>

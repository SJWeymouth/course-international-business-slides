<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-label="Conciliation and arbitration backed by reputation sanctions" font-family="Source Sans Pro, Arial, sans-serif">
<title>Conciliation and arbitration backed by reputation sanctions</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><rect x="25" y="125" width="285" height="185" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="173" font-size="28" fill="#1f4e79" font-weight="600">DISPUTE</text><text x="49" y="225" font-size="31" fill="#041e42" font-weight="400">Conciliation</text><text x="49" y="266" font-size="31" fill="#041e42" font-weight="400">seeks settlement</text><rect x="410" y="125" width="300" height="185" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="434" y="173" font-size="28" fill="#1f4e79" font-weight="600">UNRESOLVED</text><text x="434" y="225" font-size="31" fill="#041e42" font-weight="400">Industry arbitrators</text><text x="434" y="266" font-size="31" fill="#041e42" font-weight="400">decide the claim</text><rect x="855" y="25" width="515" height="155" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="879" y="73" font-size="28" fill="#1f4e79" font-weight="600">AWARD PAID</text><text x="879" y="125" font-size="31" fill="#041e42" font-weight="400">Proceeding stays officially private</text><rect x="855" y="250" width="515" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="879" y="298" font-size="28" fill="#1f4e79" font-weight="600">AWARD UNPAID</text><text x="879" y="350" font-size="31" fill="#041e42" font-weight="400">Bourses worldwide share</text><text x="879" y="391" font-size="31" fill="#041e42" font-weight="400">the dealer’s name and photo</text><text x="879" y="432" font-size="31" fill="#041e42" font-weight="400">Trading access is threatened</text><path d="M330 216 L387 216" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M730 216 H785 V103 H833" fill="none" stroke="#52749a" stroke-width="4" marker-end="url(#arrow)"/><path d="M785 216 V337 H833" fill="none" stroke="#52749a" stroke-width="4" marker-end="url(#arrow)"/></svg>
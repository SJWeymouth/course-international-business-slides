<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">World trade in services by mode of supply, 2017, WTO estimates</title>
<desc id="desc">A chart: Mode 1, cross-border supply, 27.7 percent, highlighted; Mode 2, consumption abroad, 10.4 percent; Mode 3, commercial presence, 58.9 percent; Mode 4, presence of people, 2.9 percent.</desc>
<rect width="1000" height="562" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF WORLD SERVICES TRADE, 2017</text>
<text x="10" y="130" font-size="32" fill="#041e42">Mode 1: cross-border supply</text>
<rect x="10" y="146" width="294.9" height="54" fill="#8a7a5c"/>
<text x="320.9" y="186.0" font-size="32" font-weight="700" fill="#8a7a5c">27.7%</text>
<text x="10" y="248" font-size="32" fill="#041e42">Mode 2: consumption abroad</text>
<rect x="10" y="264" width="110.7" height="54" fill="#041e42"/>
<text x="136.7" y="304.0" font-size="32" font-weight="400" fill="#5b6672">10.4%</text>
<text x="10" y="366" font-size="32" fill="#041e42">Mode 3: commercial presence</text>
<rect x="10" y="382" width="627.0" height="54" fill="#041e42"/>
<text x="653.0" y="422.0" font-size="32" font-weight="400" fill="#5b6672">58.9%</text>
<text x="10" y="484" font-size="32" fill="#041e42">Mode 4: presence of people</text>
<rect x="10" y="500" width="30.9" height="54" fill="#041e42"/>
<text x="56.9" y="540.0" font-size="32" font-weight="400" fill="#5b6672">2.9%</text>
</svg>

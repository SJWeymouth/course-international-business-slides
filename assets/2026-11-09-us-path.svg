<title id="title">U.S. real GDP per person, 1990 to 2025, against its 1990 to 2007 trend, thousands of 2015 dollars</title>
<desc id="desc">Two lines. Actual GDP per person rises from 39 thousand dollars in 1990 to 54 in 2007, falls to 52 in 2009, and reaches 68 in 2025. The 1990 to 2007 trend, dashed, continues to 81 in 2025. The shaded gap after 2007 widens to about 12.6 thousand dollars a person in 2025, highlighted.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Three layers of the AI value chain and the firms that lead each</title>
<desc id="desc">Diagram of three boxes joined by arrows from left to right. Chips: Nvidia, TSMC, and ASML, covering design, fabrication, and chipmaking machines. Compute: Azure, Google Cloud, AWS, and Alibaba Cloud, the processing capacity that trains and runs models. Models: OpenAI, Anthropic, and DeepSeek, frontier models that other products build on.</desc>
<rect width="1600" height="520" fill="#ffffff"/>
<rect x="30.0" y="20" width="450" height="470" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<rect x="30.0" y="20" width="450" height="70" fill="#041e42"/>
<text x="255.0" y="68" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">CHIPS</text>
<text x="255.0" y="174" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">Nvidia</text>
<text x="255.0" y="230" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">TSMC</text>
<text x="255.0" y="286" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">ASML</text>
<text x="255.0" y="416" font-size="28" font-weight="400" fill="#5b6672" text-anchor="middle">design, fabrication,</text>
<text x="255.0" y="454" font-size="28" font-weight="400" fill="#5b6672" text-anchor="middle">and chipmaking machines</text>
<line x1="492.0" y1="255.0" x2="537.0" y2="255.0" stroke="#8a7a5c" stroke-width="9"/>
<polygon points="563.0,255.0 537.0,273.2 537.0,236.8" fill="#8a7a5c"/>
<rect x="575.0" y="20" width="450" height="470" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<rect x="575.0" y="20" width="450" height="70" fill="#041e42"/>
<text x="800.0" y="68" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">COMPUTE</text>
<text x="800.0" y="152" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">Azure</text>
<text x="800.0" y="208" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">Google Cloud</text>
<text x="800.0" y="264" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">AWS</text>
<text x="800.0" y="320" font-size="40" font-weight="700" fill="#041e42" text-anchor="middle">Alibaba Cloud</text>

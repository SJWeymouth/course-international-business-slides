<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">How INSTEX was meant to let European firms trade with Iran without cross-border payments</title>
<desc id="desc">Diagram in two halves, Europe on the left and Iran on the right, divided by a dashed border. Goods cross the border in both directions: from an Iranian exporter to a European importer, and from a European exporter to an Iranian importer. Money stays on each side: the European importer pays the European exporter through INSTEX, highlighted, and the Iranian importer pays the Iranian exporter through Iran's counterpart, STFI, highlighted. At the bottom: no money crosses the border.</desc>

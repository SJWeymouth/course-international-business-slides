<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="395" viewBox="0 0 1400 395" role="img" font-family="Arial, Helvetica, sans-serif"><title>One company, three countries: traditional treaty rules</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#365f91"/></marker></defs><rect x="20" y="35" width="420" height="330" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2"/><text x="44" y="88" font-size="30" fill="#041e42" font-weight="600" text-anchor="start">GERMANY</text><text x="44" y="133" font-size="27" fill="#365f91" font-weight="400" text-anchor="start">The company’s tax home</text><text x="44" y="211" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">May tax the company’s profits.</text><text x="44" y="254" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">Relief prevents taxing the</text><text x="44" y="297" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">same foreign profit twice.</text><rect x="490" y="35" width="420" height="330" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2"/><text x="514" y="88" font-size="30" fill="#041e42" font-weight="600" text-anchor="start">POLAND</text><text x="514" y="133" font-size="27" fill="#365f91" font-weight="400" text-anchor="start">The company’s factory branch</text><text x="514" y="211" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">Taxes the profit earned</text><text x="514" y="254" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">by the factory.</text><rect x="960" y="35" width="420" height="330" fill="#f7f5f1" stroke="#8a7f75" stroke-width="2"/><text x="984" y="88" font-size="30" fill="#041e42" font-weight="600" text-anchor="start">FRANCE</text><text x="984" y="133" font-size="27" fill="#365f91" font-weight="400" text-anchor="start">Customers only</text><text x="984" y="211" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">Sales alone generally give</text><text x="984" y="254" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">France no right to tax</text><text x="984" y="297" font-size="27" fill="#041e42" font-weight="400" text-anchor="start">this company’s profit.</text></svg>
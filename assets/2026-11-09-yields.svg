<title id="title">Ten-year government bond yields, monthly, 2007 to 2014, percent: Greece, Portugal, Ireland, Germany</title>
<desc id="desc">Four lines. All near 4 to 5 percent in 2007 and 2008. Greece, highlighted, rises from 2010 to a peak of 29 percent in February 2012. Portugal peaks at 14 percent in January 2012 and Ireland at 12 percent in July 2011. Germany falls below 2 percent. All fall after 2012.</desc>

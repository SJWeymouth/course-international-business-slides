<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-label="Ownership and location are separate choices" font-family="Source Sans Pro, Arial, sans-serif"><title>Ownership and location are separate choices</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="365" y="42" font-size="28" fill="#1f4e79" font-weight="600">OWN OPERATION</text><text x="910" y="42" font-size="28" fill="#1f4e79" font-weight="600">CONTRACT WITH SUPPLIER</text><text x="25" y="155" font-size="28" fill="#1f4e79" font-weight="600">AT HOME</text><text x="25" y="365" font-size="28" fill="#1f4e79" font-weight="600">ABROAD</text><rect x="270" y="70" width="505" height="170" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="294" y="117" font-size="27" fill="#1f4e79" font-weight="600">DOMESTIC INTEGRATION</text><text x="294" y="167" font-size="31" fill="#041e42" font-weight="400">Apple’s Sacramento assembly</text><rect x="825" y="70" width="550" height="170" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="849" y="117" font-size="27" fill="#1f4e79" font-weight="600">DOMESTIC OUTSOURCING</text><text x="849" y="167" font-size="31" fill="#041e42" font-weight="400">An independent home supplier</text><rect x="270" y="280" width="505" height="170" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="294" y="327" font-size="27" fill="#1f4e79" font-weight="600">FOREIGN AFFILIATE</text><text x="294" y="377" font-size="31" fill="#041e42" font-weight="400">Apple’s Cork operation</text><rect x="825" y="280" width="550" height="170" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="849" y="327" font-size="27" fill="#1f4e79" font-weight="600">FOREIGN OUTSOURCING</text><text x="849" y="377" font-size="31" fill="#041e42" font-weight="400">Apple buys Foxconn assembly</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="A two-by-two grid. Rows: at home and abroad. Columns: the firm owns it, and another firm does it. At home and owned is domestic production: Tesla's own plant in Fremont, California. At home and another firm is outsourcing: Flex builds Apple's Mac Pro in Austin, Texas. Abroad and owned is foreign direct investment: Toyota's own plant in Georgetown, Kentucky. Abroad and another firm is offshore outsourcing: Foxconn builds Apple's iPhone in Shenzhen, China." font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Location and ownership are separate choices</title>
<!-- column headers -->
<text x="590" y="60" font-size="30" fill="#041e42" font-weight="600" text-anchor="middle">THE FIRM OWNS IT</text>
<text x="1110" y="60" font-size="30" fill="#041e42" font-weight="600" text-anchor="middle">ANOTHER FIRM DOES IT</text>
<!-- row headers -->
<text x="250" y="200" font-size="30" fill="#041e42" font-weight="600" text-anchor="end">AT HOME</text>
<text x="250" y="420" font-size="30" fill="#041e42" font-weight="600" text-anchor="end">ABROAD</text>
<!-- cells -->
<rect x="340" y="90" width="500" height="200" fill="#eef2f7" stroke="#9cadc4" stroke-width="2"/>
<rect x="860" y="90" width="500" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<rect x="340" y="310" width="500" height="200" fill="#eef2f7" stroke="#9cadc4" stroke-width="2"/>
<rect x="860" y="310" width="500" height="200" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<!-- cell terms -->
<g font-size="36" fill="#041e42" font-weight="600" text-anchor="middle">
<text x="590" y="168">Domestic production</text>
<text x="1110" y="168">Outsourcing</text>
<text x="590" y="388">Foreign direct investment</text>
<text x="1110" y="388">Offshore outsourcing</text>
</g>
<!-- cell examples -->
<g font-size="27" fill="#4a5663" text-anchor="middle">
<text x="590" y="214">Tesla's own plant</text>
<text x="590" y="250">Fremont, California</text>
<text x="1110" y="214">Flex builds Apple's Mac Pro</text>
<text x="1110" y="250">Austin, Texas</text>
<text x="590" y="434">Toyota's own plant</text>
<text x="590" y="470">Georgetown, Kentucky</text>
<text x="1110" y="434">Foxconn builds Apple's iPhone</text>
<text x="1110" y="470">Shenzhen, China</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">When just in time fits and when just in case fits</title>
<desc id="desc">A table with four rows. Demand: steady for just in time, swings for just in case. Suppliers: nearby and many, or distant and few. Part: easy to replace, or hard to replace. Cost of running out: small, or production stops, highlighted.</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<rect x="300" y="40" width="330" height="80" fill="#041e42"/><text x="465" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">Just in Time</text>
<rect x="650" y="40" width="340" height="80" fill="#8a7a5c"/><text x="820" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">Just in case</text>
<line x1="10" y1="240" x2="990" y2="240" stroke="#cdd9e6" stroke-width="3"/>
<text x="10" y="192.0" font-size="34" font-weight="700" fill="#041e42">Demand</text>
<text x="465" y="192.0" text-anchor="middle" font-size="34" fill="#041e42">Steady</text>
<text x="820" y="192.0" text-anchor="middle" font-size="34" fill="#8a7a5c" font-weight="700">Swings</text>
<line x1="10" y1="360" x2="990" y2="360" stroke="#cdd9e6" stroke-width="3"/>
<text x="10" y="312.0" font-size="34" font-weight="700" fill="#041e42">Suppliers</text>
<text x="465" y="312.0" text-anchor="middle" font-size="34" fill="#041e42">Nearby, many</text>
<text x="820" y="312.0" text-anchor="middle" font-size="34" fill="#8a7a5c" font-weight="700">Distant, few</text>
<line x1="10" y1="480" x2="990" y2="480" stroke="#cdd9e6" stroke-width="3"/>
<text x="10" y="432.0" font-size="34" font-weight="700" fill="#041e42">Part</text>
<text x="465" y="432.0" text-anchor="middle" font-size="34" fill="#041e42">Easy to replace</text>
<text x="820" y="432.0" text-anchor="middle" font-size="34" fill="#8a7a5c" font-weight="700">Hard to replace</text>
<line x1="10" y1="600" x2="990" y2="600" stroke="#cdd9e6" stroke-width="3"/>
<text x="10" y="552.0" font-size="34" font-weight="700" fill="#041e42">Running out</text>
<text x="465" y="552.0" text-anchor="middle" font-size="34" fill="#041e42">Costs little</text>
<text x="820" y="552.0" text-anchor="middle" font-size="34" fill="#8a7a5c" font-weight="700">Stops production</text>
</svg>

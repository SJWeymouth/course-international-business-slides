<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="578" viewBox="0 0 1600 578" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Labor compensation as a share of value added, United States manufacturing industries, 2021</title>
<desc id="desc">Horizontal bars from textiles, apparel, and leather at 76 percent down to refined petroleum at 12 percent; all manufacturing is 48 percent.</desc>
<rect width="1600" height="578" fill="#ffffff"/>
<text x="460" y="42" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">LABOR COMPENSATION AS A SHARE OF VALUE ADDED, 2021</text>
<text x="444" y="98.8" text-anchor="end" font-size="34" fill="#041e42">Textiles, apparel, leather</text>
<rect x="460" y="70" width="970.0" height="40" fill="#041e42"/>
<text x="1442.0" y="98.8" font-size="34" fill="#5b6672">76%</text>
<text x="444" y="150.8" text-anchor="end" font-size="34" fill="#041e42">Machinery</text>
<rect x="460" y="122" width="782.9" height="40" fill="#041e42"/>
<text x="1254.9" y="150.8" font-size="34" fill="#5b6672">62%</text>
<text x="444" y="202.8" text-anchor="end" font-size="34" fill="#041e42">Motor vehicles</text>
<rect x="460" y="174" width="732.0" height="40" fill="#041e42"/>
<text x="1204.0" y="202.8" font-size="34" fill="#5b6672">58%</text>
<text x="444" y="254.8" text-anchor="end" font-size="34" fill="#041e42">Computers, electronics</text>
<rect x="460" y="226" width="710.3" height="40" fill="#041e42"/>
<text x="1182.3" y="254.8" font-size="34" fill="#5b6672">56%</text>
<text x="444" y="306.8" text-anchor="end" font-size="34" fill="#041e42">Basic metals</text>
<rect x="460" y="278" width="612.3" height="40" fill="#041e42"/>
<text x="1084.3" y="306.8" font-size="34" fill="#5b6672">48%</text>
<text x="444" y="358.8" text-anchor="end" font-size="34" fill="#041e42">All manufacturing</text>
<rect x="460" y="330" width="617.4" height="40" fill="#8a7a5c"/>
<text x="1089.4" y="358.8" font-size="34" fill="#5b6672">48%</text>
<text x="444" y="410.8" text-anchor="end" font-size="34" fill="#041e42">Pharmaceuticals</text>
<rect x="460" y="382" width="332.2" height="40" fill="#041e42"/>
<text x="804.2" y="410.8" font-size="34" fill="#5b6672">26%</text>
<text x="444" y="462.8" text-anchor="end" font-size="34" fill="#041e42">Chemicals</text>
<rect x="460" y="434" width="300.4" height="40" fill="#041e42"/>
<text x="772.4" y="462.8" font-size="34" fill="#5b6672">24%</text>
<text x="444" y="514.8" text-anchor="end" font-size="34" fill="#041e42">Refined petroleum</text>
<rect x="460" y="486" width="159.1" height="40" fill="#041e42"/>
<text x="631.1" y="514.8" font-size="34" fill="#5b6672">12%</text>
<line x1="460" y1="64" x2="460" y2="532" stroke="#5b6672" stroke-width="2"/>
</svg>

<line x1="770.0" y1="238.0" x2="770.0" y2="382.0" stroke="#5b6672" stroke-width="6"/>
<polygon points="770.0,402.0 756.0,382.0 784.0,382.0" fill="#5b6672"/>
<line x1="552.0" y1="517.0" x2="468.0" y2="517.0" stroke="#5b6672" stroke-width="6"/>
<polygon points="448.0,517.0 468.0,503.0 468.0,531.0" fill="#5b6672"/>
<line x1="230.0" y1="402.0" x2="230.0" y2="388.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="230.0,368.0 244.0,388.0 216.0,388.0" fill="#8a7a5c"/>
<text x="230.0" y="296" font-size="27" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">LAST TWO STEPS PAUSED</text>

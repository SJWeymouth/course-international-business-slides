<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Time for NotPetya to take over two Ukrainian networks, and time for Maersk to disconnect its own</title>
<desc id="desc">A chart in seconds: a Ukrainian transit hub fully infected in 16 seconds; a large Ukrainian bank in 45 seconds; Maersk took more than two hours, 7,200 seconds, to disconnect its network, highlighted. The first two bars are barely visible beside the third.</desc>
<rect width="1000" height="426" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">TIME, SECONDS</text>
<text x="10" y="126" font-size="36" fill="#041e42">A Ukrainian transit hub's network</text>
<rect x="10" y="138" width="6.0" height="48" fill="#041e42"/>
<text x="32.0" y="174.5" font-size="36" font-weight="400" fill="#5b6672">16 seconds</text>
<text x="10" y="238" font-size="36" fill="#041e42">A large Ukrainian bank's network</text>
<rect x="10" y="250" width="6.0" height="48" fill="#041e42"/>
<text x="32.0" y="286.5" font-size="36" font-weight="400" fill="#5b6672">45 seconds</text>
<text x="10" y="350" font-size="36" fill="#041e42">Unplugging Maersk's network</text>
<rect x="10" y="362" width="660.0" height="48" fill="#8a7a5c"/>
<text x="686.0" y="398.5" font-size="36" font-weight="700" fill="#8a7a5c">more than 2 hours</text>
</svg>

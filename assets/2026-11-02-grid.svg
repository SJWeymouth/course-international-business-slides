<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Activity grid: better or worse off by 2004, and stuck or able to move on to new work</title>
<desc id="desc">An empty two-by-two grid. The vertical axis runs from worse off at the bottom to better off at the top. The horizontal axis runs from stuck on the left to can move on on the right. The square for better off and can move on is shaded.</desc>
<rect width="1000" height="640" fill="#ffffff"/>
<rect x="625.0" y="20" width="355.0" height="270.0" fill="#cdd9e6"/>
<rect x="270" y="20" width="710" height="540" fill="none" stroke="#041e42" stroke-width="4"/>
<line x1="625.0" y1="20" x2="625.0" y2="560" stroke="#041e42" stroke-width="3"/>
<line x1="270" y1="290.0" x2="980" y2="290.0" stroke="#041e42" stroke-width="3"/>
<text x="447.5" y="620" text-anchor="middle" font-size="50" fill="#041e42">Stuck</text>
<text x="802.5" y="620" text-anchor="middle" font-size="50" fill="#041e42">Can move on</text>
<text x="250" y="171.0" text-anchor="end" font-size="50" fill="#041e42">Better off</text>
<text x="250" y="441.0" text-anchor="end" font-size="50" fill="#041e42">Worse off</text>
</svg>

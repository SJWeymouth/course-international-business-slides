<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">China's and Vietnam's shares of U.S. goods imports and the U.S. share of China's goods exports, 2015 to 2026</title>
<desc id="desc">Three lines in percent. China's share of U.S. goods imports: 21.5 in 2015, 21.6 in 2017, 16.6 in 2022, 9.0 in 2025, and 7.7 in January to September 2026. The U.S. share of China's goods exports: 18.0 in 2015, 19.2 in 2018, 16.2 in 2022, 11.1 in 2025, and 10.2 in January to July 2026. Vietnam's share of U.S. goods imports, highlighted: 1.7 in 2015, 3.9 in 2022, 5.7 in 2025, and 7.4 in January to September 2026. The last segment of each line is dashed because 2026 is part of a year.</desc>

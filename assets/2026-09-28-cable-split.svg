<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="350" viewBox="0 0 1600 350" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">One Ethernet cable at three retail prices and the two dollars paid to its maker</title>
<desc id="desc">Horizontal bars: 29.95 dollars for the specialty brand, 19.95 for the office-store house brand, 15.95 unbranded on eBay, and 2 dollars paid to the maker in Shenzhen.</desc>
<rect width="1600" height="350" fill="#ffffff"/>
<text x="600" y="42" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">DOLLARS PER CABLE</text>
<text x="584" y="110.8" text-anchor="end" font-size="34" fill="#041e42">Specialty brand, retail</text>
<rect x="600" y="80" width="800.0" height="44" fill="#041e42"/>
<text x="1412.0" y="110.8" font-size="34" fill="#5b6672">$29.95</text>
<text x="584" y="170.8" text-anchor="end" font-size="34" fill="#041e42">Office-store house brand, retail</text>
<rect x="600" y="140" width="532.9" height="44" fill="#041e42"/>
<text x="1144.9" y="170.8" font-size="34" fill="#5b6672">$19.95</text>
<text x="584" y="230.8" text-anchor="end" font-size="34" fill="#041e42">Unbranded on eBay, retail</text>
<rect x="600" y="200" width="426.0" height="44" fill="#041e42"/>
<text x="1038.0" y="230.8" font-size="34" fill="#5b6672">$15.95</text>
<text x="584" y="290.8" text-anchor="end" font-size="34" fill="#041e42">Paid to the maker in Shenzhen</text>
<rect x="600" y="260" width="53.4" height="44" fill="#8a7a5c"/>
<text x="665.4" y="290.8" font-size="34" fill="#5b6672">$2</text>
<line x1="600" y1="74" x2="600" y2="310" stroke="#5b6672" stroke-width="2"/>
</svg>

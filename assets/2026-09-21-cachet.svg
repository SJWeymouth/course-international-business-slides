<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Written evidence supports a private agreement" font-family="Source Sans Pro, Arial, sans-serif">
<title>Written evidence supports a private agreement</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><rect x="30" y="100" width="385" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="54" y="148" font-size="28" fill="#1f4e79" font-weight="600">BUYER’S OFFER</text><text x="54" y="200" font-size="31" fill="#041e42" font-weight="400">Stone in sealed parcel</text><text x="54" y="241" font-size="31" fill="#041e42" font-weight="400">Price and terms recorded</text><text x="54" y="282" font-size="31" fill="#041e42" font-weight="400">Buyer signs across seal</text><rect x="515" y="100" width="350" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="539" y="148" font-size="28" fill="#1f4e79" font-weight="600">BROKER</text><text x="539" y="200" font-size="31" fill="#041e42" font-weight="400">Carries the offer</text><text x="539" y="241" font-size="31" fill="#041e42" font-weight="400">to the seller</text><rect x="965" y="100" width="400" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="989" y="148" font-size="28" fill="#1f4e79" font-weight="600">SELLER</text><text x="989" y="200" font-size="31" fill="#041e42" font-weight="400">Sees the buyer’s terms</text><text x="989" y="241" font-size="31" fill="#041e42" font-weight="400">Can verify the offer</text><path d="M435 218 L490 218" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M885 218 L940 218" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="30" y="405" font-size="31" fill="#041e42" font-weight="400">The record makes it harder for a broker to misreport the offered price.</text></svg>
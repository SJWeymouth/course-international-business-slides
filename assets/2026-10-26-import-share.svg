<title id="title">U.S. net petroleum imports as a share of U.S. petroleum use, 1950 to 2025</title>
<desc id="desc">One line. Net imports were 8 percent of U.S. petroleum use in 1950, 35 percent in 1973 (highlighted), peaked at 60 percent in 2005, fell below zero in 2020 when the United States became a net exporter, and were minus 14 percent in 2025.</desc>

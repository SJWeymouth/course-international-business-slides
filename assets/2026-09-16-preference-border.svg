<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="385" viewBox="0 0 1360 385" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, Helvetica Neue, Arial, sans-serif"><title id="title">Should cutting and sewing determine origin?</title><desc id="desc">Non-originating fabric made outside CAFTA-DR enters Honduras, where a shirt is cut and sewn before shipment to the United States. The diagram asks whether the shirt should receive duty-free entry.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1f4e79"/></marker></defs><rect x="410" y="60" width="900" height="300" fill="#f4f6f8" stroke="#1f4e79" stroke-width="2"/><text x="440" y="100" font-size="25" fill="#1f4e79" font-weight="600" text-anchor="start">CAFTA-DR AGREEMENT REGION</text><rect x="25" y="175" width="270" height="115" fill="#e5ecf3" stroke="none" stroke-width="2"/><text x="160" y="216" font-size="27" fill="#041e42" font-weight="600" text-anchor="middle">Non-originating fabric</text><text x="160" y="257" font-size="23" fill="#041e42" font-weight="400" text-anchor="middle">Made outside CAFTA-DR</text><rect x="465" y="175" width="290" height="115" fill="#e5ecf3" stroke="none" stroke-width="2"/><text x="610" y="220" font-size="31" fill="#041e42" font-weight="600" text-anchor="middle">Honduras</text><text x="610" y="260" font-size="27" fill="#041e42" font-weight="400" text-anchor="middle">Cuts and sews</text><rect x="990" y="175" width="280" height="115" fill="#041e42" stroke="none" stroke-width="2"/><text x="1130" y="220" font-size="30" fill="white" font-weight="600" text-anchor="middle">United States</text><text x="1130" y="260" font-size="26" fill="white" font-weight="400" text-anchor="middle">Duty-free entry?</text><path d="M300 230L450 230" stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M765 230L975 230" stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="370" y="165" font-size="24" fill="#1f4e79" font-weight="400" text-anchor="middle">Fabric</text><text x="865" y="165" font-size="24" fill="#1f4e79" font-weight="400" text-anchor="middle">Shirt</text></svg>

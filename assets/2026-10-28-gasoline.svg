<title id="title">U.S. average retail price of regular gasoline, monthly, January 2025 to September 2026</title>
<desc id="desc">A line in dollars per gallon: about 3.10 through 2025, 2.91 in February 2026, then 3.64 in March, 4.48 in May (highlighted), 3.93 in July, and 4.36 in September 2026. A marker shows the war beginning on February 28, 2026.</desc>

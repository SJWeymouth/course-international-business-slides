<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">One Ethernet cable, three retail prices, two dollars to the maker</title>
  <desc id="desc">Three vertical bars show retail prices of $29.95 for the specialty brand, $19.95 for a chain-store house brand, and $15.95 unbranded on eBay. At the base of each bar a small taupe segment marks the $2 paid to the Shenzhen-area maker.</desc>
  <rect width="1600" height="600" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">RETAIL PRICE OF THE SAME CABLE</text>

  <!-- baseline at y=500; 14px per dollar -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="#4a5663" stroke-width="3"/>

  <!-- bar 1: $29.95 -> 419px -->
  <g>
    <rect x="260" y="81" width="220" height="419" fill="#041e42"/>
    <rect x="260" y="472" width="220" height="28" fill="#b3a394"/>
    <text x="370" y="130" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">$29.95</text>
    <text x="370" y="545" text-anchor="middle" font-size="27" fill="#041e42">Specialty brand</text>
  </g>
  <!-- bar 2: $19.95 -> 279px -->
  <g>
    <rect x="690" y="221" width="220" height="279" fill="#365f91"/>
    <rect x="690" y="472" width="220" height="28" fill="#b3a394"/>
    <text x="800" y="270" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">$19.95</text>
    <text x="800" y="545" text-anchor="middle" font-size="27" fill="#041e42">Office-store house brand</text>
  </g>
  <!-- bar 3: $15.95 -> 223px -->
  <g>
    <rect x="1120" y="277" width="220" height="223" fill="#7f95b2"/>
    <rect x="1120" y="472" width="220" height="28" fill="#b3a394"/>
    <text x="1230" y="326" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">$15.95</text>
    <text x="1230" y="545" text-anchor="middle" font-size="27" fill="#041e42">Unbranded, eBay</text>
  </g>

  <!-- maker label -->
  <path d="M1345 486 H 1372" stroke="#8a7a5c" stroke-width="4"/>
  <text x="1380" y="495" font-size="26" font-weight="700" fill="#8a7a5c">$2 to the maker</text>
</svg>

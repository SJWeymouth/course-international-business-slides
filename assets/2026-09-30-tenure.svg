<title id="title">Wal-Mart's international markets: year entered and year left, 1991 to 2025</title>
<desc id="desc">Horizontal bars from the entry year to the exit year or to 2025 for thirteen markets: Mexico from 1991, Canada 1994, Argentina 1995 to 2020, Brazil 1995 to 2018, China 1996, Germany 1997 to 2006, South Korea 1998 to 2006, United Kingdom 1999 to 2021, Japan 2002 to 2021, Central America 2005, Chile 2008, India 2010, South Africa 2011.</desc>

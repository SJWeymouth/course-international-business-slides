<text x="150" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">INDEX, 2008 = 100, EACH GRIDLINE DOUBLES</text>
<line x1="150" y1="540.0" x2="1180" y2="540.0" stroke="#cdd9e6" stroke-width="2"/>
<text x="136" y="549.0" text-anchor="end" font-size="28" fill="#5b6672">100</text>

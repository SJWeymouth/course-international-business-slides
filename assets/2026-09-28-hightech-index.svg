<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">High-technology exports of China and Vietnam, 2008 to 2023, indexed to 2008 = 100 on a doubling scale</title>
<desc id="desc">Two lines from 100 in 2008 on a logarithmic axis where each gridline doubles: Vietnam climbs to about 4,430 by 2023 and China to about 210. Labels give the dollar levels: China 392 billion dollars in 2008 and 825 billion in 2023; Vietnam 3 billion and 133 billion.</desc>

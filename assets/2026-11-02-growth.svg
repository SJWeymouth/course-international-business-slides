<title id="title">World exports of goods and of services, 1980 to 2025, index 1980 = 100, each gridline doubles</title>
<desc id="desc">Two lines on a doubling scale. Services, highlighted, start at 0.4 trillion dollars in 1980 and reach 2,328, about 23 times, in 2025. Goods start at 2.0 trillion dollars and reach 1,262, about 13 times.</desc>

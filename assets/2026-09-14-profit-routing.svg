<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="pr-title pr-desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="pr-title">How a sale in Europe became profit taxed almost nowhere</title>
  <desc id="pr-desc">A European customer pays an Irish operating company, which books the sale. The Irish company pays a royalty for the right to use the intellectual property. Because of Ireland's treaties with European nations the royalty passes through a Dutch conduit almost tax-free, and reaches a tax-free company in the British Virgin Islands. Very little taxable profit remains at any stage before the last one. The patents themselves were created in California.</desc>

  <defs>
    <marker id="pr-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#52749a"/>
    </marker>
    <marker id="pr-arrow-tan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8a7a5c"/>
    </marker>
  </defs>

  <rect width="1400" height="560" fill="#ffffff"/>

  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">EVERY ARROW BELOW IS A PRICE THE FIRM SET FOR ITSELF</text>

  <!-- flow boxes -->
  <g text-anchor="middle">
    <g transform="translate(30,120)">
      <rect width="280" height="150" rx="6" fill="#e6ecf3" stroke="#1f4e79" stroke-width="2"/>
      <text x="140" y="42" font-size="20" font-weight="700" letter-spacing="1.2" fill="#1f4e79">CUSTOMER</text>
      <text x="140" y="76" font-size="23" fill="#041e42">Europe, Africa,</text>
      <text x="140" y="104" font-size="23" fill="#041e42">the Middle East</text>
      <text x="140" y="132" font-size="21" fill="#6b7280">buys the product</text>
    </g>

    <g transform="translate(390,120)">
      <rect width="280" height="150" rx="6" fill="#e6ecf3" stroke="#1f4e79" stroke-width="2"/>
      <text x="140" y="42" font-size="20" font-weight="700" letter-spacing="1.2" fill="#1f4e79">IRELAND</text>
      <text x="140" y="76" font-size="23" fill="#041e42">Operating company</text>
      <text x="140" y="104" font-size="23" fill="#041e42">books the sale</text>
      <text x="140" y="132" font-size="21" fill="#6b7280">revenue lands here</text>
    </g>

    <g transform="translate(750,120)">
      <rect width="280" height="150" rx="6" fill="#f0ece3" stroke="#8a7a5c" stroke-width="2"/>
      <text x="140" y="42" font-size="20" font-weight="700" letter-spacing="1.2" fill="#8a7a5c">NETHERLANDS</text>
      <text x="140" y="76" font-size="23" fill="#041e42">Conduit company</text>
      <text x="140" y="104" font-size="23" fill="#041e42">the royalty passes</text>
      <text x="140" y="132" font-size="21" fill="#6b7280">withholding avoided</text>
    </g>

    <g transform="translate(1110,120)">
      <rect width="280" height="150" rx="6" fill="#f0ece3" stroke="#8a7a5c" stroke-width="2"/>
      <text x="140" y="42" font-size="20" font-weight="700" letter-spacing="1.2" fill="#8a7a5c">CARIBBEAN</text>
      <text x="140" y="76" font-size="23" fill="#041e42">A tax-free company</text>
      <text x="140" y="104" font-size="23" fill="#041e42">in the Virgin Islands</text>
      <text x="140" y="132" font-size="21" fill="#6b7280">no office, no telephone</text>
    </g>
  </g>

  <!-- arrows between boxes -->
  <path d="M318 195 H378" fill="none" stroke="#52749a" stroke-width="6" marker-end="url(#pr-arrow)"/>
  <path d="M678 195 H738" fill="none" stroke="#52749a" stroke-width="6" marker-end="url(#pr-arrow)"/>
  <path d="M1038 195 H1098" fill="none" stroke="#52749a" stroke-width="6" marker-end="url(#pr-arrow)"/>

  <text x="348" y="178" text-anchor="middle" font-size="19" fill="#52749a">price</text>
  <text x="708" y="178" text-anchor="middle" font-size="19" fill="#52749a">royalty</text>
  <text x="1068" y="178" text-anchor="middle" font-size="19" fill="#52749a">royalty</text>

  <!-- taxable profit strip -->
  <text x="30" y="330" font-size="21" font-weight="600" letter-spacing="1.2" fill="#6b7280">TAXABLE PROFIT LEFT BEHIND AT EACH STOP</text>

  <g>
    <rect x="390" y="348" width="280" height="46" rx="4" fill="#ffffff" stroke="#7088a4" stroke-width="2"/>
    <text x="530" y="379" text-anchor="middle" font-size="22" fill="#041e42">a thin margin</text>

    <rect x="750" y="348" width="280" height="46" rx="4" fill="#ffffff" stroke="#7088a4" stroke-width="2"/>
    <text x="890" y="379" text-anchor="middle" font-size="22" fill="#041e42">almost none</text>

    <rect x="1110" y="348" width="280" height="46" rx="4" fill="#041e42"/>
    <text x="1250" y="379" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">the rest, tax-free</text>
  </g>

  <!-- IP origin -->
  <g transform="translate(390,440)">
    <rect width="640" height="92" rx="6" fill="#ffffff" stroke="#8a7a5c" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1.2" fill="#8a7a5c">UNITED STATES</text>
    <text x="320" y="70" text-anchor="middle" font-size="23" fill="#041e42">The patents were created in California.</text>
  </g>
  <path d="M1030 486 H1240 V400" fill="none" stroke="#8a7a5c" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#pr-arrow-tan)"/>
  <text x="1250" y="512" text-anchor="middle" font-size="20" fill="#8a7a5c">royalties are sent to the far end</text>
</svg>

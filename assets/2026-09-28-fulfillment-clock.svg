<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">An online order travels from Illinois to Shenzhen and back in 48 hours</title>
  <desc id="desc">Six stages on a timeline: the customer clicks in Illinois in the afternoon, the order appears in Shenzhen at night, the night shift packs it, a courier collects it at 9 a.m. for the Hong Kong airport, the flight leaves for Anchorage at 6 p.m., and the package reaches the customer's door 48 hours after the click.</desc>
  <rect width="1600" height="420" fill="#ffffff"/>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="36" markerHeight="36" refX="30" refY="18" orient="auto"><path d="M0,0 L36,18 L0,36 z" fill="#7f95b2"/></marker></defs>

  <line x1="80" y1="210" x2="1585" y2="210" stroke="#9cadc4" stroke-width="10" marker-end="url(#arrow)"/>

  <g text-anchor="middle">
    <g transform="translate(160 210)">
      <circle r="22" fill="#041e42"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">Afternoon</text>
      <text y="-38" font-size="24" fill="#4a5663">Illinois</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">CLICK</text>
    </g>
    <g transform="translate(410 210)">
      <circle r="22" fill="#365f91"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">Seconds later</text>
      <text y="-38" font-size="24" fill="#4a5663">Shenzhen, night</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">ORDER PRINTS</text>
    </g>
    <g transform="translate(660 210)">
      <circle r="22" fill="#365f91"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">Night shift</text>
      <text y="-38" font-size="24" fill="#4a5663">pick to light</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">PACKED</text>
    </g>
    <g transform="translate(910 210)">
      <circle r="22" fill="#7f95b2"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">9 a.m.</text>
      <text y="-38" font-size="24" fill="#4a5663">courier pickup</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">HONG KONG</text>
    </g>
    <g transform="translate(1160 210)">
      <circle r="22" fill="#7f95b2"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">6 p.m.</text>
      <text y="-38" font-size="24" fill="#4a5663">flight departs</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">ANCHORAGE</text>
    </g>
    <g transform="translate(1410 210)">
      <circle r="24" fill="#b3a394"/>
      <text y="-72" font-size="30" font-weight="700" fill="#041e42">48 hours</text>
      <text y="-38" font-size="24" fill="#4a5663">after the click</text>
      <text y="82" font-size="27" font-weight="700" fill="#041e42">DOORSTEP</text>
    </g>
  </g>
</svg>

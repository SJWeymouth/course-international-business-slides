<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="A specific investment can weaken a supplier’s outside option" font-family="Source Sans Pro, Arial, sans-serif">
<title>A specific investment can weaken a supplier’s outside option</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="30" y="35" font-size="25" fill="#1f4e79" font-weight="600">ILLUSTRATIVE TOOLING INVESTMENT</text><rect x="30" y="85" width="390" height="225" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="54" y="133" font-size="28" fill="#1f4e79" font-weight="600">BEFORE INVESTMENT</text><text x="54" y="185" font-size="31" fill="#041e42" font-weight="400">Supplier can serve</text><text x="54" y="226" font-size="31" fill="#041e42" font-weight="400">several potential buyers</text><rect x="515" y="85" width="360" height="225" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="539" y="133" font-size="28" fill="#1f4e79" font-weight="600">CUSTOM TOOL</text><text x="539" y="185" font-size="31" fill="#041e42" font-weight="400">Costs $100,000</text><text x="539" y="226" font-size="31" fill="#041e42" font-weight="400">Resale value: $10,000</text><rect x="970" y="85" width="400" height="225" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="994" y="133" font-size="28" fill="#1f4e79" font-weight="600">AFTER INVESTMENT</text><text x="994" y="185" font-size="31" fill="#041e42" font-weight="400">Buyer demands a cut</text><text x="994" y="226" font-size="31" fill="#041e42" font-weight="400">in the agreed price</text><path d="M440 200 L490 200" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M895 200 L945 200" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="30" y="389" font-size="31" fill="#041e42" font-weight="400">Anticipating this bargaining problem can discourage the investment.</text></svg>
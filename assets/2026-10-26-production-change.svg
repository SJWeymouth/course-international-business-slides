<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Change in oil output from 1970 to 1973, as a percent of the increase in world output</title>
<desc id="desc">Horizontal bars from a zero line: Saudi Arabia 37 percent, highlighted; Iran 20; Soviet Union 15; Iraq 4; United States minus 4; Libya minus 11.</desc>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">% OF THE RISE IN WORLD OUTPUT, 1970–73</text>
<text x="10" y="144.5" font-size="32" fill="#041e42">Saudi Arabia</text>
<rect x="420.0" y="110" width="426.7" height="46" fill="#8a7a5c"/>
<text x="858.7" y="144.5" font-size="32" font-weight="700" fill="#8a7a5c">+37</text>
<text x="10" y="230.5" font-size="32" fill="#041e42">Iran</text>
<rect x="420.0" y="196" width="228.8" height="46" fill="#041e42"/>
<text x="660.9" y="230.5" font-size="32" font-weight="400" fill="#5b6672">+20</text>
<text x="10" y="316.5" font-size="32" fill="#041e42">Soviet Union</text>
<rect x="420.0" y="282" width="169.0" height="46" fill="#041e42"/>
<text x="601.0" y="316.5" font-size="32" font-weight="400" fill="#5b6672">+15</text>
<text x="10" y="402.5" font-size="32" fill="#041e42">Iraq</text>
<rect x="420.0" y="368" width="51.8" height="46" fill="#041e42"/>
<text x="483.8" y="402.5" font-size="32" font-weight="400" fill="#5b6672">+4</text>
<text x="10" y="488.5" font-size="32" fill="#041e42">United States</text>
<rect x="378.6" y="454" width="41.4" height="46" fill="#041e42"/>
<text x="432.0" y="488.5" font-size="32" font-weight="400" fill="#5b6672">-4</text>
<text x="10" y="574.5" font-size="32" fill="#041e42">Libya</text>
<rect x="298.1" y="540" width="121.9" height="46" fill="#041e42"/>
<text x="432.0" y="574.5" font-size="32" font-weight="400" fill="#5b6672">-11</text>
<line x1="420" y1="90" x2="420" y2="606" stroke="#5b6672" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Saudi oil output in July 1972 and July 1973</title>
<desc id="desc">Two horizontal bars: 5.4 million barrels a day in July 1972 and 8.4 million in July 1973 (highlighted), 62 percent higher.</desc>
<rect width="1000" height="380" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SAUDI OIL OUTPUT, MILLION BARRELS A DAY</text>
<text x="10" y="130" font-size="34" fill="#041e42">July 1972</text>
<rect x="10" y="144" width="432.0" height="50" fill="#041e42"/>
<text x="458.0" y="181.0" font-size="34" font-weight="400" fill="#5b6672">5.4</text>
<text x="10" y="280" font-size="34" fill="#041e42">July 1973</text>
<rect x="10" y="294" width="672.0" height="50" fill="#8a7a5c"/>
<text x="698.0" y="331.0" font-size="34" font-weight="700" fill="#8a7a5c">8.4</text>
</svg>

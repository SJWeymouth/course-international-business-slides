<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Where the price of a $1,000 laptop goes, by a factory manager's estimate</title>
  <desc id="desc">A single horizontal bar representing $1,000. Segments show roughly $300 to Intel and Microsoft, about $450 to the makers of the screen, disk, and other major components, about $20 to the keyboard maker, a little less to the courier, under $50 to the retailer, $30 to $40 staying in China with the factory and its workers, and a remainder of other costs.</desc>
  <rect width="1600" height="520" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">RETAIL PRICE $1,000 · FACTORY MANAGER'S ESTIMATE · 1.4 PX PER DOLLAR</text>

  <!-- bar: x from 60, width 1400 = $1,000 -->
  <g transform="translate(60 90)">
    <rect x="0" y="0" width="420" height="150" fill="#041e42"/>
    <rect x="420" y="0" width="630" height="150" fill="#365f91"/>
    <rect x="1050" y="0" width="28" height="150" fill="#7f95b2"/>
    <rect x="1078" y="0" width="24" height="150" fill="#9cadc4"/>
    <rect x="1102" y="0" width="70" height="150" fill="#cdd9e6"/>
    <rect x="1172" y="0" width="49" height="150" fill="#8a7a5c"/>
    <rect x="1221" y="0" width="179" height="150" fill="#eeeae4"/>

    <text x="210" y="66" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">$300</text>
    <text x="210" y="108" text-anchor="middle" font-size="24" fill="#ffffff">Intel and Microsoft</text>
    <text x="735" y="66" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">about $450</text>
    <text x="735" y="108" text-anchor="middle" font-size="24" fill="#ffffff">screen, disk, other components</text>
    <text x="1310" y="84" text-anchor="middle" font-size="24" fill="#5b6672">other costs</text>
  </g>

  <!-- leaders below the bar, staggered -->
  <g stroke="#708090" stroke-width="3" fill="none">
    <path d="M1124 242 V 300 H 1000"/>
    <path d="M1150 242 V 345 H 1000"/>
    <path d="M1197 242 V 390 H 1000"/>
  </g>
  <text x="990" y="308" text-anchor="end" font-size="26" fill="#34414e">keyboard maker, $15 to $20</text>
  <text x="990" y="353" text-anchor="end" font-size="26" fill="#34414e">FedEx or UPS, slightly less</text>
  <text x="990" y="398" text-anchor="end" font-size="26" fill="#34414e">retailer, under $50</text>

  <!-- China highlight -->
  <path d="M1256 242 V 440" stroke="#8a7a5c" stroke-width="4"/>
  <text x="1256" y="478" text-anchor="middle" font-size="32" font-weight="700" fill="#8a7a5c">$30 to $40 stays in China</text>
</svg>

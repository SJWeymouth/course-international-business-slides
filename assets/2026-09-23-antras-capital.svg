<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Scatter plot of 23 U.S. manufacturing industries, 1987 to 1994. Horizontal axis: capital per worker in the industry, log scale. Vertical axis: share of U.S. imports that were intrafirm, log scale. The share rises with capital per worker. Textiles and apparel sit at the bottom left at about 2 percent; electronic components and computers sit in the middle at about 37 percent; industrial chemicals sit farthest right at about 36 percent; drugs sit at the top at about 66 percent." font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

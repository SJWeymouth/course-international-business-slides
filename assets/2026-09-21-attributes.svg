<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-label="Asset specificity, uncertainty, and frequency push a transaction from market toward hierarchy" font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Three attributes of a transaction</title>
<defs><marker id="arrow2" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#52749a"/></marker></defs>
<text x="30" y="35" font-size="25" fill="#1f4e79" font-weight="600">WILLIAMSON: WHAT ABOUT THE TRANSACTION DECIDES ITS GOVERNANCE?</text>
<rect x="30" y="80" width="425" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="54" y="125" font-size="28" fill="#1f4e79" font-weight="600">ASSET SPECIFICITY</text>
<text x="54" y="170" font-size="25" fill="#041e42">Value lost if the partner walks</text>
<text x="54" y="208" font-size="24" fill="#8a7a5c">A body plant built next to GM</text>
<rect x="487" y="80" width="425" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="511" y="125" font-size="28" fill="#1f4e79" font-weight="600">UNCERTAINTY</text>
<text x="511" y="170" font-size="25" fill="#041e42">How much will need adapting later</text>
<text x="511" y="208" font-size="24" fill="#8a7a5c">A design that changes mid-run</text>
<rect x="945" y="80" width="425" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="969" y="125" font-size="28" fill="#1f4e79" font-weight="600">FREQUENCY</text>
<text x="969" y="170" font-size="25" fill="#041e42">How often the deal recurs</text>
<text x="969" y="208" font-size="24" fill="#8a7a5c">Daily trades on 47th Street</text>
<path d="M242 240 L242 300" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
<path d="M700 240 L700 300" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
<path d="M1157 240 L1157 300" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
<rect x="30" y="320" width="1340" height="60" fill="#cdd9e6"/>
<rect x="30" y="320" width="447" height="60" fill="#9cadc4"/>
<rect x="923" y="320" width="447" height="60" fill="#365f91"/>
<text x="54" y="360" font-size="29" fill="#041e42" font-weight="600">MARKET</text>
<text x="620" y="360" font-size="29" fill="#041e42" font-weight="600">HYBRID</text>
<text x="1190" y="360" font-size="29" fill="#ffffff" font-weight="600">HIERARCHY</text>
<text x="30" y="440" font-size="31" fill="#041e42">The higher these three, the more the transaction is worth bringing inside.</text>
</svg>

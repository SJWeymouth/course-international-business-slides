<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">U.S. employment by sector, 1840 to 2015, percent of all workers</title>
<desc id="desc">Three lines in percent of workers. Agriculture falls from 63 in 1840 to 26 in 1920, 11 in 1950, and 1 in 2015. Industry, which includes manufacturing, mining, and construction, rises from 15 in 1840 to 34 in 1950 and falls to 15 in 2015. Services, highlighted, rise from 22 in 1840 to 55 in 1950 and 84 in 2015.</desc>

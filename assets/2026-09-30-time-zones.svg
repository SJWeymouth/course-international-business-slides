<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 30 1000 470" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ten in the morning in Shanghai is seven the previous evening in Cupertino</title>
  <desc id="desc">Two clock faces. The left, labeled Shanghai, shows 10 a.m. The right, labeled Cupertino, shows 7 p.m. the previous day. An arrow between them reads fifteen hours.</desc>
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- Shanghai clock -->
  <g transform="translate(250 240)">
    <circle r="150" fill="#f5f3ef" stroke="#041e42" stroke-width="6"/>
    <g stroke="#041e42" stroke-width="4">
      <line x1="0" y1="-135" x2="0" y2="-115"/>
      <line x1="135" y1="0" x2="115" y2="0"/>
      <line x1="0" y1="135" x2="0" y2="115"/>
      <line x1="-135" y1="0" x2="-115" y2="0"/>
    </g>
    <!-- hour hand at 10 -->
    <line x1="0" y1="0" x2="-45" y2="-78" stroke="#041e42" stroke-width="10" stroke-linecap="round"/>
    <!-- minute hand at 12 -->
    <line x1="0" y1="0" x2="0" y2="-115" stroke="#041e42" stroke-width="6" stroke-linecap="round"/>
    <circle r="9" fill="#041e42"/>
    <text y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">SHANGHAI</text>
    <text y="240" text-anchor="middle" font-size="28" fill="#4a5663">10 a.m.</text>
  </g>

  <!-- arrow -->
  <line x1="430" y1="240" x2="570" y2="240" stroke="#8a7a5c" stroke-width="5"/>
  <text x="500" y="222" text-anchor="middle" font-size="26" font-weight="600" fill="#8a7a5c" letter-spacing="1">15 HOURS</text>

  <!-- Cupertino clock -->
  <g transform="translate(750 240)">
    <circle r="150" fill="#041e42" stroke="#041e42" stroke-width="6"/>
    <g stroke="#ffffff" stroke-width="4">
      <line x1="0" y1="-135" x2="0" y2="-115"/>
      <line x1="135" y1="0" x2="115" y2="0"/>
      <line x1="0" y1="135" x2="0" y2="115"/>
      <line x1="-135" y1="0" x2="-115" y2="0"/>
    </g>
    <!-- hour hand at 7 -->
    <line x1="0" y1="0" x2="-45" y2="78" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-115" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle r="9" fill="#ffffff"/>
    <text y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">CUPERTINO</text>
    <text y="240" text-anchor="middle" font-size="28" fill="#4a5663">7 p.m., the day before</text>
  </g>
</svg>

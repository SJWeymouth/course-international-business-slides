<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-label="Three transaction costs of using the market, with diamond-trade examples" font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Three transaction costs of using the market</title>
<text x="30" y="35" font-size="25" fill="#1f4e79" font-weight="600">THE COSTS OF USING THE PRICE MECHANISM</text>
<rect x="30" y="80" width="420" height="250" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="54" y="128" font-size="24" fill="#1f4e79" font-weight="600">SEARCH AND INFORMATION</text>
<text x="54" y="180" font-size="31" fill="#041e42">Who is trustworthy?</text>
<text x="54" y="221" font-size="31" fill="#041e42">What is this stone worth?</text>
<text x="54" y="290" font-size="24" fill="#8a7a5c">Bourse, brokers, certificates</text>
<rect x="490" y="80" width="420" height="250" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="514" y="128" font-size="24" fill="#1f4e79" font-weight="600">BARGAINING AND CONTRACTING</text>
<text x="514" y="180" font-size="31" fill="#041e42">Agree a price and terms</text>
<text x="514" y="221" font-size="31" fill="#041e42">Record what was agreed</text>
<text x="514" y="290" font-size="24" fill="#8a7a5c">Handshake, cachet, 60-day terms</text>
<rect x="950" y="80" width="420" height="250" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
<text x="974" y="128" font-size="24" fill="#1f4e79" font-weight="600">MONITORING AND ENFORCEMENT</text>
<text x="974" y="180" font-size="31" fill="#041e42">Did the other side perform?</text>
<text x="974" y="221" font-size="31" fill="#041e42">What happens if not?</text>
<text x="974" y="290" font-size="24" fill="#8a7a5c">Arbitration, posted photograph</text>
<text x="30" y="410" font-size="31" fill="#041e42">Every one of these costs is paid by someone: the parties, an intermediary, or the club.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Course map: the nine modules of the course, complete</title>
<desc id="desc">Nine filled circles on a line, one per module: 1 Simple product, 2 Trade, 3 Borders, 4 Multinationals, 5 Bargaining, 6 Energy, 7 Backlash, 8 Shocks, and 9 Governance, larger and highlighted. A bracket over Modules 1 to 4 reads How firms organize, and a bracket over Modules 5 to 9 reads Firms and governments. A tick between Modules 4 and 5 marks the midterm.</desc>
<rect width="1600" height="340" fill="#ffffff"/>
<path d="M60.0,112 L60.0,96 L665.0,96 L665.0,112" fill="none" stroke="#5b6672" stroke-width="2"/>
<text x="362.5" y="72" font-size="32" font-weight="600" fill="#1f4e79" text-anchor="middle" letter-spacing="1">HOW FIRMS ORGANIZE</text>
<path d="M760.0,112 L760.0,96 L1540.0,96 L1540.0,112" fill="none" stroke="#5b6672" stroke-width="2"/>
<text x="1150.0" y="72" font-size="32" font-weight="600" fill="#1f4e79" text-anchor="middle" letter-spacing="1">FIRMS AND GOVERNMENTS</text>
<line x1="100.0" y1="230" x2="1500.0" y2="230" stroke="#041e42" stroke-width="4"/>
<line x1="712.5" y1="204" x2="712.5" y2="256" stroke="#5b6672" stroke-width="3"/>
<text x="712.5" y="190" font-size="26" font-weight="400" fill="#5b6672" text-anchor="middle">Midterm</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">The Sanchez family's yearly income before and after the mill closed, against the poverty line for a family of five</title>
<desc id="desc">A chart: 35,000 dollars before the mill closed in 2001; 13,000 dollars in August 2003, highlighted. A dashed line marks the poverty line of 21,959 dollars.</desc>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">THE SANCHEZ FAMILY'S INCOME A YEAR</text>
<text x="10" y="130" font-size="36" fill="#041e42">Before the mill closed (2001)</text>
<rect x="10" y="146" width="635.5" height="54" fill="#041e42"/>
<text x="661.5" y="186.0" font-size="36" font-weight="400" fill="#5b6672">$35,000</text>
<text x="10" y="260" font-size="36" fill="#041e42">August 2003</text>
<rect x="10" y="276" width="236.1" height="54" fill="#8a7a5c"/>
<text x="262.1" y="316.0" font-size="36" font-weight="700" fill="#8a7a5c">$13,000</text>
<line x1="408.7" y1="130" x2="408.7" y2="340" stroke="#5b6672" stroke-width="3" stroke-dasharray="8 6"/>
<text x="408.7" y="380" text-anchor="middle" font-size="30" fill="#5b6672">Poverty line, family of five: $21,959</text>
</svg>

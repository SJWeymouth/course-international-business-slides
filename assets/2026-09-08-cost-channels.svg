<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Five cost channels affected by containerization</title>
  <desc id="desc">Handling, loss, idle time, reliability, and coordination combine to reduce total landed cost.</desc>
  <rect width="1600" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7f95b2"/></marker>
  </defs>
  <line x1="125" y1="285" x2="1440" y2="285" stroke="#c8d1dc" stroke-width="7" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(165 285)"><circle r="96" fill="#041e42"/><text y="-12" font-size="28" font-weight="700" fill="#fff">LESS</text><text y="24" font-size="25" fill="#fff">handling labor</text></g>
    <g transform="translate(455 285)"><circle r="96" fill="#294f7d"/><text y="-12" font-size="28" font-weight="700" fill="#fff">LESS</text><text y="24" font-size="24" fill="#fff">theft + damage</text></g>
    <g transform="translate(745 285)"><circle r="96" fill="#54759c"/><text y="-12" font-size="28" font-weight="700" fill="#fff">LESS</text><text y="24" font-size="24" fill="#fff">idle inventory</text></g>
    <g transform="translate(1035 285)"><circle r="96" fill="#7f95b2"/><text y="-12" font-size="27" font-weight="700" fill="#041e42">MORE</text><text y="24" font-size="24" fill="#041e42">reliability</text></g>
    <g transform="translate(1325 285)"><circle r="96" fill="#b3a394"/><text y="-12" font-size="27" font-weight="700" fill="#041e42">EASIER</text><text y="24" font-size="24" fill="#041e42">coordination</text></g>
    <text x="800" y="515" font-size="42" font-weight="700" fill="#041e42">Lower total landed cost</text>
    <text x="800" y="565" font-size="25" fill="#4a5663">freight + insurance + inventory + delay + management</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="618" viewBox="0 0 1000 618" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">World market shares of the leading firms in chipmaking machines, data center graphics chips, contract chipmaking, and cloud</title>
<desc id="desc">A chart in percent of the world market: ASML, extreme-ultraviolet chip machines, 100; Nvidia, data center graphics chips, 2024, 92, highlighted; TSMC, contract chipmaking, second quarter of 2026, 72.5; Amazon, Microsoft, and Google together, cloud, third quarter of 2026, 61.</desc>
<rect width="1000" height="618" fill="#ffffff"/>
<text x="10" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF THE WORLD MARKET, PERCENT</text>
<text x="10" y="126" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">ASML: extreme-ultraviolet chip machines</text>
<rect x="10" y="138" width="870.0" height="46" fill="#041e42"/>
<text x="896.0" y="173.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">100</text>
<text x="10" y="258" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">Nvidia: data center graphics chips, 2024</text>
<rect x="10" y="270" width="800.4" height="46" fill="#8a7a5c"/>
<text x="826.4" y="305.0" font-size="34" font-weight="700" fill="#8a7a5c" text-anchor="start">92</text>
<text x="10" y="390" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">TSMC: contract chipmaking, Q2 2026</text>
<rect x="10" y="402" width="630.8" height="46" fill="#041e42"/>
<text x="656.8" y="437.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">72.5</text>
<text x="10" y="522" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">Amazon, Microsoft, Google: cloud, Q3 2026</text>
<rect x="10" y="534" width="530.7" height="46" fill="#041e42"/>
<text x="556.7" y="569.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">61</text>
</svg>

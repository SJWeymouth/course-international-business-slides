<rect width="1000" height="350" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">JAGUAR LAND ROVER'S REVENUE IN THE QUARTER</text>
<text x="10" y="126" font-size="36" fill="#041e42">July to September 2024</text>
<rect x="10" y="138" width="650.0" height="48" fill="#041e42"/>
<text x="676.0" y="174.5" font-size="36" font-weight="400" fill="#5b6672">£6.5 billion</text>
<text x="10" y="256" font-size="36" fill="#041e42">July to September 2025</text>
<rect x="10" y="268" width="490.0" height="48" fill="#8a7a5c"/>
<text x="516.0" y="304.5" font-size="36" font-weight="700" fill="#8a7a5c">£4.9 billion</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Jobs in oil and gas extraction and support activities against all U.S. nonfarm jobs, 2005 to 2025, indexed to 2007 = 100</title>
<desc id="desc">Two lines indexed to 2007 = 100. Oil and gas jobs, highlighted, rise from 99 in 2009 to 143 in 2014, fall back to 99 in 2016, and are 87 in 2025. All U.S. jobs fall to 95 in 2009 and 2010, return to 101 in 2014, and reach 115 in 2025.</desc>

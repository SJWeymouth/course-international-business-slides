<title id="title">Global Supply Chain Pressure Index, January 1998 to September 2026</title>
<desc id="desc">A line chart of the New York Fed index, in standard deviations from its average, where zero is normal. It stays near zero until 2020, peaks at 4.4 in December 2021, falls below zero in 2023, and rises to 1.8 in May 2026, highlighted.</desc>

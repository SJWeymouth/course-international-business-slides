<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Apple's China teams report to global functions, not to the Managing Director of Greater China</title>
  <desc id="desc">A row of five function boxes in Cupertino at the top (operations, product design, retail, research and development, government affairs), each connected by a solid line to a matching China team box below. To the right, a box labeled Managing Director, Greater China, sits beside the China teams with only a dashed line and no solid reporting line to any of them.</desc>
  <rect width="1600" height="600" fill="#ffffff"/>

  <text x="60" y="52" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">CUPERTINO · ONE P&amp;L · FUNCTIONS</text>
  <text x="60" y="378" font-size="24" font-weight="600" letter-spacing="1.4" fill="#1f4e79">CHINA TEAMS</text>

  <g font-size="24" font-weight="700" text-anchor="middle">
    <!-- functions -->
    <rect x="60" y="80" width="230" height="90" fill="#041e42"/><text x="175" y="134" fill="#ffffff">OPERATIONS</text>
    <rect x="310" y="80" width="230" height="90" fill="#041e42"/><text x="425" y="134" fill="#ffffff">PRODUCT DESIGN</text>
    <rect x="560" y="80" width="230" height="90" fill="#041e42"/><text x="675" y="134" fill="#ffffff">RETAIL</text>
    <rect x="810" y="80" width="230" height="90" fill="#041e42"/><text x="925" y="134" fill="#ffffff">R&amp;D</text>
    <rect x="1060" y="80" width="230" height="90" fill="#041e42"/><text x="1175" y="134" fill="#ffffff">GOVT AFFAIRS</text>

    <!-- China teams -->
    <rect x="60" y="410" width="230" height="90" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="175" y="464" fill="#041e42">OPS, SHANGHAI</text>
    <rect x="310" y="410" width="230" height="90" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="425" y="464" fill="#041e42">PD, CHINA</text>
    <rect x="560" y="410" width="230" height="90" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="675" y="464" fill="#041e42">APPLE STORES</text>
    <rect x="810" y="410" width="230" height="90" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="925" y="464" fill="#041e42">R&amp;D, CHINA</text>
    <rect x="1060" y="410" width="230" height="90" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="1175" y="464" fill="#041e42">GOVT AFFAIRS</text>
  </g>

  <!-- solid reporting lines -->
  <g stroke="#52749a" stroke-width="5">
    <line x1="175" y1="170" x2="175" y2="410"/>
    <line x1="425" y1="170" x2="425" y2="410"/>
    <line x1="675" y1="170" x2="675" y2="410"/>
    <line x1="925" y1="170" x2="925" y2="410"/>
    <line x1="1175" y1="170" x2="1175" y2="410"/>
  </g>

  <!-- MD box -->
  <rect x="1320" y="380" width="260" height="150" fill="#ffffff" stroke="#8a7a5c" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1450" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#8a7a5c">MANAGING DIRECTOR</text>
  <text x="1450" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#8a7a5c">GREATER CHINA</text>
  <line x1="1290" y1="455" x2="1320" y2="455" stroke="#b3ada4" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="1450" y="345" text-anchor="middle" font-size="22" fill="#8a7a5c">14,000 on paper</text>
</svg>

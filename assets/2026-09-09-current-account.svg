<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="ca-title ca-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="ca-title">The current account and how a deficit is financed</title>
  <desc id="ca-desc">Money flowing in from exports and earnings abroad, set against money flowing out for imports and interest paid abroad. The difference is the current account. Thailand ran a deficit of about 8 percent of GDP in 1996, which had to be covered by foreign lending and investment. The deficit is sustainable only while that lending continues.</desc>

  <defs>
    <marker id="ca-arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#52749a"/>
    </marker>
    <marker id="ca-arrow-gold" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#8a7f75"/>
    </marker>
  </defs>

  <rect width="1400" height="470" fill="#ffffff"/>

  <!-- Money in -->
  <rect x="40" y="52" width="380" height="150" rx="3" fill="#eaf0f6" stroke="#b9c7d8" stroke-width="1.5"/>
  <text x="60" y="86" font-size="23" font-weight="bold" fill="#041e42">MONEY IN</text>
  <text x="60" y="124" font-size="21" fill="#24303c">Exports of goods and services</text>
  <text x="60" y="156" font-size="21" fill="#24303c">Earnings sent home from abroad</text>
  <text x="60" y="188" font-size="19" font-style="italic" fill="#8a7f75">Thai clothes, shoes, electronics</text>

  <!-- Money out -->
  <rect x="40" y="232" width="380" height="150" rx="3" fill="#f7f3ee" stroke="#d6c8b4" stroke-width="1.5"/>
  <text x="60" y="266" font-size="23" font-weight="bold" fill="#041e42">MONEY OUT</text>
  <text x="60" y="304" font-size="21" fill="#24303c">Imports of goods and services</text>
  <text x="60" y="336" font-size="21" fill="#24303c">Interest paid to foreign lenders</text>
  <text x="60" y="368" font-size="19" font-style="italic" fill="#8a7f75">Machinery, components, oil</text>

  <line x1="428" y1="127" x2="516" y2="185" stroke="#52749a" stroke-width="2.5" marker-end="url(#ca-arrow)"/>
  <line x1="428" y1="307" x2="516" y2="249" stroke="#52749a" stroke-width="2.5" marker-end="url(#ca-arrow)"/>

  <!-- The balance -->
  <rect x="528" y="140" width="330" height="154" rx="3" fill="#ffffff" stroke="#041e42" stroke-width="2.5"/>
  <text x="693" y="180" font-size="22" font-weight="bold" text-anchor="middle" fill="#041e42">THE CURRENT ACCOUNT</text>
  <text x="693" y="210" font-size="19" text-anchor="middle" fill="#66717d">what is left over in a year</text>
  <text x="693" y="262" font-size="42" font-weight="bold" text-anchor="middle" fill="#041e42">−8% of GDP</text>
  <text x="693" y="286" font-size="18" text-anchor="middle" fill="#8a7f75">Thailand, 1996</text>

  <line x1="866" y1="217" x2="962" y2="217" stroke="#8a7f75" stroke-width="2.5" marker-end="url(#ca-arrow-gold)"/>
  <text x="914" y="200" font-size="18" font-style="italic" text-anchor="middle" fill="#8a7f75">financed by</text>

  <!-- Financing -->
  <rect x="974" y="140" width="386" height="154" rx="3" fill="#f0ece3" stroke="#8a7f75" stroke-width="2"/>
  <text x="1167" y="180" font-size="22" font-weight="bold" text-anchor="middle" fill="#041e42">FOREIGN LENDING</text>
  <text x="1167" y="216" font-size="20" text-anchor="middle" fill="#24303c">Short-term dollar loans,</text>
  <text x="1167" y="244" font-size="20" text-anchor="middle" fill="#24303c">much of it rolled over</text>
  <text x="1167" y="278" font-size="20" font-weight="bold" text-anchor="middle" fill="#041e42">every 90 days</text>

  <line x1="40" y1="416" x2="1360" y2="416" stroke="#c9c2b6" stroke-width="1.5"/>
  <text x="40" y="450" font-size="22" fill="#24303c">Short-term foreign lending financed the deficit. The crisis began when lenders stopped rolling over those loans.</text>
</svg>

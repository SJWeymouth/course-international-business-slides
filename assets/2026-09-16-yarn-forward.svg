<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="310" viewBox="0 65 1400 310" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif">
  <title id="title">The yarn-forward rule of origin</title>
  <desc id="desc">For this simplified garment example, yarn spinning, fabric knitting, and garment assembly occur within the CAFTA-DR region. Cotton may come from outside. Product-specific rules and exceptions apply.</desc>
  <rect width="1400" height="470" fill="#ffffff"/>
  <g text-anchor="middle">
    <rect x="35" y="90" width="230" height="145" rx="10" fill="#f2f0ec" stroke="#8d8171" stroke-width="3"/>
    <text x="150" y="140" font-size="23" font-weight="800" fill="#6b1d2a">1 · COTTON</text>
    <text x="150" y="190" font-size="31" font-weight="700" fill="#041e42">Grown</text>
    <rect x="310" y="90" width="230" height="145" rx="10" fill="#f6e7b0" stroke="#b29b5b" stroke-width="5"/>
    <text x="425" y="140" font-size="23" font-weight="800" fill="#6b1d2a">2 · YARN</text>
    <text x="425" y="190" font-size="31" font-weight="700" fill="#041e42">Spun</text>
    <rect x="585" y="90" width="230" height="145" rx="10" fill="#f6e7b0" stroke="#b29b5b" stroke-width="5"/>
    <text x="700" y="140" font-size="23" font-weight="800" fill="#6b1d2a">3 · FABRIC</text>
    <text x="700" y="190" font-size="31" font-weight="700" fill="#041e42">Knit</text>
    <rect x="860" y="90" width="230" height="145" rx="10" fill="#f6e7b0" stroke="#b29b5b" stroke-width="5"/>
    <text x="975" y="140" font-size="23" font-weight="800" fill="#6b1d2a">4 · GARMENT</text>
    <text x="975" y="190" font-size="31" font-weight="700" fill="#041e42">Cut and sewn</text>
    <rect x="1135" y="90" width="230" height="145" rx="10" fill="#f2f0ec" stroke="#8d8171" stroke-width="3"/>
    <text x="1250" y="140" font-size="23" font-weight="800" fill="#6b1d2a">5 · ENTRY</text>
    <text x="1250" y="190" font-size="31" font-weight="700" fill="#041e42">U.S. border</text>
  </g>
  <line x1="330" y1="285" x2="1070" y2="285" stroke="#6b1d2a" stroke-width="10" stroke-linecap="round"/>
  <line x1="330" y1="270" x2="330" y2="305" stroke="#6b1d2a" stroke-width="7"/>
  <line x1="1070" y1="270" x2="1070" y2="305" stroke="#6b1d2a" stroke-width="7"/>
  <text x="700" y="355" text-anchor="middle" font-size="38" font-weight="800" fill="#6b1d2a">YARN FORWARD</text>

</svg>

<title id="title">Share of single-family mortgages at U.S. banks 30 days or more past due, quarterly, 2000 to 2012, percent</title>
<desc id="desc">A line in percent, with the years of falling home prices, July 2006 to February 2012, shaded. The share is about 2 from 2000 to 2006, 1.6 in early 2006, then rises to 3.7 in early 2008, 8.0 in early 2009, and a peak of 11.5 in early 2010, highlighted, and stays near 10 through 2012.</desc>

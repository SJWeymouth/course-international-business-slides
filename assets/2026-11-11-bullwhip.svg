<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">U.S. spending on goods and U.S. goods imports, monthly, 2019 to 2023, 2019 average = 100</title>
<desc id="desc">Two lines, dollar values with the 2019 average set to 100. Both fall to about 85 in spring 2020, during the lockdowns. Spending on goods then rises steadily, to 131 in March 2022 and 137 by December 2023. Goods imports, highlighted, rise faster, to a peak of 138 in March 2022, then fall to 121 by June 2023, well below spending.</desc>

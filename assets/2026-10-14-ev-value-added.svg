<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Share of the car’s value created in China: BYD Seal and Tesla Model 3 made in Shanghai</title>
<desc id="desc">Two horizontal bars: 90 percent of the BYD Seal’s value is created in China; 45 percent of the Shanghai-made Tesla Model 3’s value is (highlighted).</desc>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF THE CAR’S VALUE CREATED IN CHINA</text>
<text x="10" y="140" font-size="36" fill="#041e42">BYD Seal</text>
<rect x="10" y="156" width="747.0" height="58" fill="#041e42"/>
<text x="773.0" y="196.6" font-size="36" fill="#5b6672">90%</text>
<text x="10" y="290" font-size="36" fill="#041e42">Tesla Model 3, made in Shanghai</text>
<rect x="10" y="306" width="373.5" height="58" fill="#8a7a5c"/>
<text x="399.5" y="346.6" font-size="36" fill="#5b6672">45%</text>
</svg>

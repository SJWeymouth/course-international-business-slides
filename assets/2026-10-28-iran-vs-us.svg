<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Change from 2011 in U.S. crude oil production and in Iran's crude oil exports, 2012 and 2013</title>
<desc id="desc">Bars above and below zero in million barrels a day. U.S. production was up 0.85 in 2012 and 1.82 in 2013. Iran's exports were down 1.0 in 2012 and 1.4 in 2013 (highlighted).</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">CHANGE FROM 2011, MILLION BARRELS A DAY</text>
<line x1="90" y1="530.0" x2="980" y2="530.0" stroke="#cdd9e6" stroke-width="2"/>
<text x="78" y="541.0" text-anchor="end" font-size="30" fill="#5b6672">−2</text>
<line x1="90" y1="436.7" x2="980" y2="436.7" stroke="#cdd9e6" stroke-width="2"/>
<text x="78" y="447.7" text-anchor="end" font-size="30" fill="#5b6672">−1</text>
<line x1="90" y1="343.3" x2="980" y2="343.3" stroke="#5b6672" stroke-width="2"/>
<text x="78" y="354.3" text-anchor="end" font-size="30" fill="#5b6672">0</text>
<line x1="90" y1="250.0" x2="980" y2="250.0" stroke="#cdd9e6" stroke-width="2"/>
<text x="78" y="261.0" text-anchor="end" font-size="30" fill="#5b6672">+1</text>
<line x1="90" y1="156.7" x2="980" y2="156.7" stroke="#cdd9e6" stroke-width="2"/>
<text x="78" y="167.7" text-anchor="end" font-size="30" fill="#5b6672">+2</text>
<rect x="173.0" y="264.0" width="133.5" height="79.3" fill="#041e42"/>
<text x="239.8" y="252.0" text-anchor="middle" font-size="30" font-weight="700" fill="#041e42">+0.85</text>
<rect x="318.5" y="343.3" width="133.5" height="93.3" fill="#8a7a5c"/>
<text x="385.2" y="472.7" text-anchor="middle" font-size="30" font-weight="700" fill="#8a7a5c">−1.0</text>
<text x="312.5" y="580" text-anchor="middle" font-size="32" fill="#5b6672">2012</text>
<rect x="618.0" y="173.4" width="133.5" height="170.0" fill="#041e42"/>
<text x="684.8" y="161.4" text-anchor="middle" font-size="30" font-weight="700" fill="#041e42">+1.82</text>
<rect x="763.5" y="343.3" width="133.5" height="130.7" fill="#8a7a5c"/>
<text x="830.2" y="510.0" text-anchor="middle" font-size="30" font-weight="700" fill="#8a7a5c">−1.4</text>
<text x="757.5" y="580" text-anchor="middle" font-size="32" fill="#5b6672">2013</text>
<rect x="114" y="102.0" width="26" height="26" fill="#041e42"/><text x="152" y="125.0" font-size="30" fill="#041e42">U.S. output</text>
<rect x="350" y="102.0" width="26" height="26" fill="#8a7a5c"/><text x="388" y="125.0" font-size="30" fill="#8a7a5c">Iran exports</text>
</svg>

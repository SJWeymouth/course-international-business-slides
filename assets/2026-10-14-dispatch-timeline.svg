<svg xmlns="http://www.w3.org/2000/svg" width="840" height="670" viewBox="0 0 840 670" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Timeline of China's rules on dispatch labor, 2008 to 2016</title>
<desc id="desc">A vertical timeline with four points: 2008, a new labor law makes regular workers costlier to employ and sets no limit on agency hiring; July 2013, agency workers must get equal pay and may fill only short jobs of under six months, support jobs, or fill-ins; March 2014, agency workers are capped at 10 percent of each company's workforce (highlighted); March 2016, the deadline to get under the cap.</desc>
<rect width="840" height="670" fill="#ffffff"/>
<line x1="30" y1="50" x2="30" y2="570" stroke="#cdd9e6" stroke-width="8"/>
<circle cx="30" cy="50" r="20" fill="#041e42"/>
<text x="76" y="44" font-size="38" font-weight="700" fill="#041e42">2008</text>
<text x="76" y="90" font-size="35" fill="#5b6672">New labor law makes regular workers</text>
<text x="76" y="130" font-size="35" fill="#5b6672">costlier; agency hiring has no limit</text>
<circle cx="30" cy="210" r="20" fill="#041e42"/>
<text x="76" y="204" font-size="38" font-weight="700" fill="#041e42">July 2013</text>
<text x="76" y="250" font-size="35" fill="#5b6672">Agency workers must get equal pay and may</text>
<text x="76" y="290" font-size="35" fill="#5b6672">fill only short jobs (under six months),</text>
<text x="76" y="330" font-size="35" fill="#5b6672">support jobs, or fill-ins</text>
<circle cx="30" cy="410" r="20" fill="#8a7a5c"/>
<text x="76" y="404" font-size="38" font-weight="700" fill="#8a7a5c">March 2014</text>
<text x="76" y="450" font-size="35" fill="#5b6672">Agency workers capped at 10% of each</text>
<text x="76" y="490" font-size="35" fill="#5b6672">company’s workforce</text>
<circle cx="30" cy="570" r="20" fill="#041e42"/>
<text x="76" y="564" font-size="38" font-weight="700" fill="#041e42">March 2016</text>
<text x="76" y="610" font-size="35" fill="#5b6672">Deadline to get under the cap</text>
</svg>

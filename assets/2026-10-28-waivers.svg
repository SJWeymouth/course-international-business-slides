<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Timeline of oil sanctions and the Strait of Hormuz, 2026</title>
<desc id="desc">A vertical timeline: February 28, the United States and Israel strike Iran; March 6, India may buy Russian oil; March 11, the IEA agrees a record stock release; March 12, sanctions on all Russian oil at sea are waived (highlighted); April 13, the United States blockades Iran's ports; October, Iran asks the United States to lift sanctions.</desc>
<rect width="900" height="574" fill="#ffffff"/>
<line x1="26" y1="40" x2="26" y2="460" stroke="#cdd9e6" stroke-width="8"/>
<circle cx="26" cy="40" r="16" fill="#041e42"/>
<text x="64" y="51" font-size="35" font-weight="700" fill="#041e42">Feb. 28</text>
<text x="222" y="52" font-size="34" fill="#5b6672">U.S. and Israel strike Iran</text>
<circle cx="26" cy="124" r="16" fill="#041e42"/>
<text x="64" y="135" font-size="35" font-weight="700" fill="#041e42">Mar. 6</text>
<text x="222" y="136" font-size="34" fill="#5b6672">India may buy Russian oil</text>
<circle cx="26" cy="208" r="16" fill="#041e42"/>
<text x="64" y="219" font-size="35" font-weight="700" fill="#041e42">Mar. 11</text>
<text x="222" y="220" font-size="34" fill="#5b6672">IEA agrees record release</text>
<circle cx="26" cy="292" r="16" fill="#8a7a5c"/>
<text x="64" y="303" font-size="35" font-weight="700" fill="#8a7a5c">Mar. 12</text>
<text x="222" y="304" font-size="34" fill="#5b6672">All Russian oil at sea waived</text>
<circle cx="26" cy="376" r="16" fill="#041e42"/>
<text x="64" y="387" font-size="35" font-weight="700" fill="#041e42">Apr. 13</text>
<text x="222" y="388" font-size="34" fill="#5b6672">U.S. blockades Iran's ports</text>
<circle cx="26" cy="460" r="16" fill="#041e42"/>
<text x="64" y="471" font-size="35" font-weight="700" fill="#041e42">Oct.</text>
<text x="222" y="472" font-size="34" fill="#5b6672">Iran asks U.S. to lift</text>
<text x="222" y="512" font-size="34" fill="#5b6672">sanctions</text>
</svg>

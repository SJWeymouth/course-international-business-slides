<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Trade Adjustment Assistance for workers, milestones, 1962 to 2022</title>
<desc id="desc">A timeline: created in 1962; easier to qualify in 1974; health insurance tax credit and a wage top-up for older workers added in 2002; service workers added in 2009; renewed in 2015; lapsed in 2022, highlighted.</desc>
<rect width="1600" height="250" fill="#ffffff"/>
<line x1="90" y1="120" x2="1490" y2="120" stroke="#5b6672" stroke-width="4"/>
<circle cx="133.1" cy="120" r="13" fill="#041e42"/>
<text x="133.1" y="86" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">1962</text>
<text x="133.1" y="44" text-anchor="middle" font-size="30" fill="#041e42">Created</text>
<circle cx="391.5" cy="120" r="13" fill="#041e42"/>
<text x="391.5" y="178" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">1974</text>
<text x="391.5" y="220" text-anchor="middle" font-size="30" fill="#041e42">Easier to qualify</text>
<circle cx="994.6" cy="120" r="13" fill="#041e42"/>
<text x="994.6" y="86" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">2002</text>
<text x="994.6" y="44" text-anchor="middle" font-size="30" fill="#041e42">Health credit added</text>
<circle cx="1145.4" cy="120" r="13" fill="#041e42"/>
<text x="1145.4" y="178" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">2009</text>
<text x="1145.4" y="220" text-anchor="middle" font-size="30" fill="#041e42">Service workers added</text>
<circle cx="1274.6" cy="120" r="13" fill="#041e42"/>
<text x="1274.6" y="86" text-anchor="middle" font-size="34" font-weight="700" fill="#041e42">2015</text>
<text x="1274.6" y="44" text-anchor="middle" font-size="30" fill="#041e42">Renewed</text>
<circle cx="1425.4" cy="120" r="13" fill="#8a7a5c"/>
<text x="1425.4" y="178" text-anchor="middle" font-size="34" font-weight="700" fill="#8a7a5c">2022</text>
<text x="1425.4" y="220" text-anchor="middle" font-size="30" fill="#8a7a5c">Lapsed</text>
</svg>

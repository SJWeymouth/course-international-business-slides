<text x="10" y="460" font-size="34" fill="#041e42">Gas in Asia (LNG)</text>
<rect x="10" y="474" width="684.7" height="50" fill="#8a7a5c"/>
<text x="710.7" y="511.0" font-size="34" font-weight="700" fill="#8a7a5c">333</text>

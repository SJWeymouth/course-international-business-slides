<title id="title">Electric cars as a share of new car sales in China, Europe, and the United States, 2015 to 2025</title>
<desc id="desc">Three lines. China rises from 1 percent in 2015 to 5 percent in 2019 and 53 percent in 2025 (highlighted); Europe reaches 28 percent and the United States 10 percent in 2025. A dashed line marks 2019, when Tesla began producing cars in Shanghai.</desc>

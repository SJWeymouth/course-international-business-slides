<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="454" viewBox="0 0 1600 454" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Meta's worldwide sales, its sales in Europe, the EU's ceiling on one fine, and the largest EU fine so far</title>
<desc id="desc">Four bars for Meta in 2025, in billions of dollars, drawn to one scale. Worldwide sales, 201. Sales in Europe, which leaving would give up each year, 47. The EU's ceiling on one fine, 10 percent of worldwide sales, 20. The largest EU fine so far, under the privacy law in 2023, 1.3, a bar too short to hold its label.</desc>
<rect width="1600" height="454" fill="#ffffff"/>
<image x="20.0" y="20.9" width="150.0" height="30.3" href="data:image/png;base64,"/>
<text x="196" y="46" font-size="28" font-weight="600" fill="#1f4e79" text-anchor="start" letter-spacing="1.2">IN 2025, BILLIONS OF DOLLARS</text>
<text x="20" y="124" font-size="30" font-weight="600" fill="#041e42" text-anchor="start">Worldwide sales</text>
<rect x="600" y="84" width="980.0" height="62" fill="#cdd9e6"/>
<text x="1562.0" y="126" font-size="32" font-weight="700" fill="#041e42" text-anchor="end">$201 billion</text>
<text x="20" y="208" font-size="30" font-weight="600" fill="#041e42" text-anchor="start">Sales in Europe</text>
<text x="20" y="238" font-size="23" font-weight="400" fill="#5b6672" text-anchor="start">what leaving would give up each year</text>
<rect x="600" y="180" width="227.2" height="62" fill="#041e42"/>
<text x="843.2" y="222" font-size="32" font-weight="700" fill="#041e42" text-anchor="start">$47 billion</text>
<text x="20" y="304" font-size="30" font-weight="600" fill="#041e42" text-anchor="start">EU ceiling on one fine</text>
<text x="20" y="334" font-size="23" font-weight="400" fill="#5b6672" text-anchor="start">10 percent of worldwide sales</text>
<rect x="600" y="276" width="98.0" height="62" fill="#8a7a5c"/>
<text x="714.0" y="318" font-size="32" font-weight="700" fill="#8a7a5c" text-anchor="start">$20 billion</text>
<text x="20" y="400" font-size="30" font-weight="600" fill="#041e42" text-anchor="start">Largest EU fine so far</text>
<text x="20" y="430" font-size="23" font-weight="400" fill="#5b6672" text-anchor="start">under the privacy law, 2023</text>
<rect x="600" y="372" width="6.3" height="62" fill="#1f4e79"/>
<text x="622.3" y="414" font-size="32" font-weight="700" fill="#041e42" text-anchor="start">$1.3 billion</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" viewBox="0 0 1000 538" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Annual rise in Argentina's prices, 1989 to 1992</title>
<desc id="desc">A chart of the annual rise in prices across Argentina's economy, in percent: 1989, 3,046; 1990, 2,078; 1991, the year of the Convertibility Law, 141, highlighted; 1992, 16.</desc>
<rect width="1000" height="538" fill="#ffffff"/>
<text x="10" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">RISE IN ARGENTINA'S PRICES, PERCENT A YEAR</text>
<text x="10" y="126" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">1989</text>
<rect x="10" y="138" width="775.3" height="46" fill="#041e42"/>
<text x="801.3" y="173.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">3,046</text>
<text x="10" y="238" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">1990</text>
<rect x="10" y="250" width="528.9" height="46" fill="#041e42"/>
<text x="554.9" y="285.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">2,078</text>
<text x="10" y="350" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">1991</text>
<rect x="10" y="362" width="35.9" height="46" fill="#8a7a5c"/>
<text x="61.9" y="397.0" font-size="34" font-weight="700" fill="#8a7a5c" text-anchor="start">141</text>
<text x="10" y="462" font-size="34" font-weight="400" fill="#041e42" text-anchor="start">1992</text>
<rect x="10" y="474" width="6.0" height="46" fill="#041e42"/>
<text x="32.0" y="509.0" font-size="34" font-weight="400" fill="#5b6672" text-anchor="start">16</text>
</svg>

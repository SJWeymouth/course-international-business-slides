<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">All workers in Apple's China supply chain in the slow months and at peak, and the largest peak a 10 percent cap on temporary workers would allow</title>
<desc id="desc">Three stacked horizontal bars of all workers, split into year-round workers and workers added for the peak. Slow months: about 900,000, all year-round. Peak before an iPhone launch: 1.7 million, of which about 800,000 are added for the peak. Peak a 10 percent cap allows: about 1.0 million, of which about 100,000 are added for the peak.</desc>
<rect width="1000" height="580" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">ALL WORKERS IN THE SUPPLY CHAIN</text>
<rect x="10" y="72" width="26" height="26" fill="#041e42"/><text x="46" y="95" font-size="30" fill="#041e42">year-round</text>
<rect x="240" y="72" width="26" height="26" fill="#8a7a5c"/><text x="276" y="95" font-size="30" fill="#041e42">added for the peak (temporary)</text>
<text x="10" y="180" font-size="36" fill="#041e42">Slow months (spring)</text>
<rect x="10" y="196" width="339.4" height="58" fill="#041e42"/>
<text x="365.4" y="236.6" font-size="36" fill="#5b6672">about 900,000</text>
<text x="10" y="330" font-size="36" fill="#041e42">Peak, before iPhone launch</text>
<rect x="10" y="346" width="339.4" height="58" fill="#041e42"/>
<rect x="349.4" y="346" width="301.7" height="58" fill="#8a7a5c"/>
<text x="667.1" y="386.6" font-size="36" fill="#5b6672">1.7 million</text>
<text x="10" y="480" font-size="36" fill="#041e42">Peak a 10% cap allows</text>
<rect x="10" y="496" width="339.4" height="58" fill="#041e42"/>
<rect x="349.4" y="496" width="37.7" height="58" fill="#8a7a5c"/>
<text x="403.1" y="536.6" font-size="36" fill="#5b6672">about 1.0 million</text>
</svg>

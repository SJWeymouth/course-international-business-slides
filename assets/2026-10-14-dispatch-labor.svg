<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Workers in Apple's China supply chain in the slow months and at peak, and the peak a 10 percent cap on temporary workers would allow</title>
<desc id="desc">Three horizontal bars: below 900,000 workers in the slow spring months; more than 1.7 million at peak before an iPhone launch; at most about 1.0 million at peak if temporary workers were capped at 10 percent. The third bar is highlighted.</desc>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">WORKERS IN THE SUPPLY CHAIN</text>
<text x="10" y="140" font-size="36" fill="#041e42">Spring, slow months</text>
<rect x="10" y="156" width="303.4" height="58" fill="#041e42"/>
<text x="329.4" y="196.6" font-size="36" fill="#5b6672">below 900,000</text>
<text x="10" y="290" font-size="36" fill="#041e42">Peak, before iPhone launch</text>
<rect x="10" y="306" width="573.1" height="58" fill="#041e42"/>
<text x="599.1" y="346.6" font-size="36" fill="#5b6672">more than 1.7 million</text>
<text x="10" y="440" font-size="36" fill="#041e42">Peak allowed under a 10% cap</text>
<rect x="10" y="456" width="337.1" height="58" fill="#8a7a5c"/>
<text x="363.1" y="496.6" font-size="36" fill="#5b6672">at most about 1.0 million</text>
</svg>

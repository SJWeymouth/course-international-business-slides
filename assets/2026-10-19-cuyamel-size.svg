<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Cuyamel Fruit as a percentage of United Fruit in the mid-1920s</title>
<desc id="desc">Three horizontal bars: Cuyamel harvested 20 percent as many bunches as United Fruit, employed 7 percent as many workers, and had 11 percent of its working capital.</desc>
<rect width="1000" height="510" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">CUYAMEL AS A % OF UNITED FRUIT</text>
<text x="10" y="140" font-size="36" fill="#041e42">Bunches harvested a year</text>
<rect x="10" y="156" width="168.0" height="54" fill="#041e42"/>
<text x="194.0" y="193.8" font-size="36" fill="#5b6672">20%</text>
<text x="10" y="280" font-size="36" fill="#041e42">Workers</text>
<rect x="10" y="296" width="56.0" height="54" fill="#041e42"/>
<text x="82.0" y="333.8" font-size="36" fill="#5b6672">7%</text>
<text x="10" y="420" font-size="36" fill="#041e42">Working capital</text>
<rect x="10" y="436" width="93.3" height="54" fill="#041e42"/>
<text x="119.3" y="473.8" font-size="36" fill="#5b6672">11%</text>
</svg>

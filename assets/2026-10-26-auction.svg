<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="493" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">How a tight and a loose oil market set the price, after the EIA</title>
<desc id="desc">A table of two rows. Tight market, price rises: demand is high or supply is low, and buyers must outbid each other. Loose market, price falls: demand is low or supply is high, and buyers wait for cheaper oil.</desc>
<rect width="1000" height="340" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">THE OIL AUCTION</text>
<line x1="10" y1="78" x2="990" y2="78" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="128" font-size="40" font-weight="600" fill="#041e42">Tight market</text>
<text x="990" y="128" text-anchor="end" font-size="40" font-weight="700" fill="#8a7a5c">Price rises</text>
<text x="10" y="174" font-size="30" fill="#5b6672">Demand is high or supply is low; buyers must outbid each other.</text>
<line x1="10" y1="208" x2="990" y2="208" stroke="#cdd9e6" stroke-width="2"/>
<text x="10" y="258" font-size="40" font-weight="600" fill="#041e42">Loose market</text>
<text x="990" y="258" text-anchor="end" font-size="40" font-weight="700" fill="#041e42">Price falls</text>
<text x="10" y="304" font-size="30" fill="#5b6672">Demand is low or supply is high; buyers wait for cheaper oil.</text>
<line x1="10" y1="338" x2="990" y2="338" stroke="#cdd9e6" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Share of world oil supply removed in major oil shocks, as estimated by the Dallas Fed</title>
<desc id="desc">Horizontal bars: 1973 Arab embargo, a little over 6 percent; 1979 Iranian revolution, about 4 percent; 1980 Iran-Iraq war, about 4 percent; 1990 Iraq invades Kuwait, a little over 6 percent; 2026 Hormuz closed, close to 20 percent (highlighted).</desc>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF WORLD OIL SUPPLY REMOVED</text>
<text x="10" y="130" font-size="34" fill="#041e42">1973, Arab embargo</text>
<rect x="10" y="144" width="228.0" height="50" fill="#041e42"/>
<text x="254.0" y="181.0" font-size="34" font-weight="400" fill="#5b6672">a little over 6%</text>
<text x="10" y="242" font-size="34" fill="#041e42">1979, Iranian revolution</text>
<rect x="10" y="256" width="144.8" height="50" fill="#041e42"/>
<text x="170.8" y="293.0" font-size="34" font-weight="400" fill="#5b6672">about 4%</text>
<text x="10" y="354" font-size="34" fill="#041e42">1980, Iran-Iraq war</text>
<rect x="10" y="368" width="144.8" height="50" fill="#041e42"/>
<text x="170.8" y="405.0" font-size="34" font-weight="400" fill="#5b6672">about 4%</text>
<text x="10" y="466" font-size="34" fill="#041e42">1990, Iraq invades Kuwait</text>
<rect x="10" y="480" width="228.0" height="50" fill="#041e42"/>
<text x="254.0" y="517.0" font-size="34" font-weight="400" fill="#5b6672">a little over 6%</text>
<text x="10" y="578" font-size="34" fill="#041e42">2026, Hormuz closed</text>
<rect x="10" y="592" width="723.8" height="50" fill="#8a7a5c"/>
<text x="749.8" y="629.0" font-size="34" font-weight="700" fill="#8a7a5c">close to 20%</text>
</svg>

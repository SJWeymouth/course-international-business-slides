<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Share of revenue from China, fiscal 2015: Qualcomm and Apple</title>
<desc id="desc">Two horizontal bars: Qualcomm earned 53 percent of its revenue from customers based in China and Hong Kong (highlighted); Apple earned 25 percent of its net sales in Greater China.</desc>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="10" y="46" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF REVENUE FROM CHINA, FISCAL 2015</text>
<text x="10" y="140" font-size="36" fill="#041e42">Qualcomm, customers in China and Hong Kong</text>
<rect x="10" y="156" width="439.9" height="58" fill="#8a7a5c"/>
<text x="465.9" y="196.6" font-size="36" fill="#5b6672">53%</text>
<text x="10" y="290" font-size="36" fill="#041e42">Apple, sales in Greater China</text>
<rect x="10" y="306" width="207.5" height="58" fill="#041e42"/>
<text x="233.5" y="346.6" font-size="36" fill="#5b6672">25%</text>
</svg>

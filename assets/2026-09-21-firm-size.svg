<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-label="Transactions ordered from hardest to buy to easiest; the cost of doing one inside rises across them while the cost of buying falls; the firm boundary is where the two cross, with transactions to the left inside the firm and those to the right bought" font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Coase's limit to the size of the firm</title>
<defs><marker id="arrow3" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#4a5663"/></marker></defs>
<!-- inside region -->
<rect x="170" y="60" width="728" height="360" fill="#eef2f7"/>
<text x="534" y="100" font-size="26" fill="#365f91" font-weight="600" text-anchor="middle">INSIDE THE FIRM</text>
<text x="1109" y="410" font-size="26" fill="#8a7a5c" font-weight="600" text-anchor="middle">BOUGHT</text>
<!-- axes -->
<path d="M170 420 L1320 420" stroke="#4a5663" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
<path d="M170 420 L170 60" stroke="#4a5663" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
<!-- axis labels -->
<text x="60" y="240" font-size="25" fill="#4a5663" text-anchor="middle" transform="rotate(-90 60 240)">Cost of one more transaction</text>
<text x="170" y="458" font-size="24" fill="#4a5663">Hardest to buy</text>
<text x="170" y="486" font-size="22" fill="#4a5663">specific, uncertain</text>
<text x="1320" y="458" font-size="24" fill="#4a5663" text-anchor="end">Easiest to buy</text>
<text x="1320" y="486" font-size="22" fill="#4a5663" text-anchor="end">standard, many suppliers</text>
<text x="745" y="522" font-size="25" fill="#4a5663" text-anchor="middle">Transactions, taken inside from left to right</text>
<!-- curves -->
<path d="M170 385 C650 370, 1000 300, 1270 120" stroke="#365f91" stroke-width="6" fill="none"/>
<text x="1262" y="100" font-size="29" fill="#365f91" font-weight="600" text-anchor="end">Cost of doing it inside</text>
<path d="M170 110 C500 150, 900 320, 1270 365" stroke="#b3a394" stroke-width="6" fill="none"/>
<text x="185" y="180" font-size="29" fill="#8a7a5c" font-weight="600">Cost of buying it</text>
<!-- crossing -->
<line x1="898" y1="289" x2="898" y2="420" stroke="#4a5663" stroke-width="2" stroke-dasharray="8 8"/>
<circle cx="898" cy="289" r="11" fill="#041e42"/>
<text x="898" y="458" font-size="26" fill="#041e42" font-weight="600" text-anchor="middle">Firm boundary</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-label="The firm grows until the cost of organizing one more transaction inside equals the cost of buying it in the market" font-family="Source Sans Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Coase's limit to the size of the firm</title>
<defs><marker id="arrow3" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#4a5663"/></marker></defs>
<text x="30" y="35" font-size="25" fill="#1f4e79" font-weight="600">COASE: WHY THE FIRM DOES NOT GROW WITHOUT LIMIT</text>
<path d="M150 380 L1300 380" stroke="#4a5663" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
<path d="M150 380 L150 70" stroke="#4a5663" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
<text x="1300" y="420" font-size="27" fill="#4a5663" text-anchor="end">Transactions organized inside the firm</text>
<text x="40" y="60" font-size="27" fill="#4a5663">Cost of organizing one more transaction</text>
<path d="M150 350 C600 330, 950 240, 1250 110" stroke="#365f91" stroke-width="6" fill="none"/>
<text x="1250" y="90" font-size="29" fill="#365f91" font-weight="600" text-anchor="end">Inside the firm</text>
<path d="M150 245 L1250 245" stroke="#b3a394" stroke-width="6" fill="none"/>
<text x="1250" y="285" font-size="29" fill="#8a7a5c" font-weight="600" text-anchor="end">Through the market</text>
<line x1="862" y1="245" x2="862" y2="380" stroke="#4a5663" stroke-width="2" stroke-dasharray="8 8"/>
<circle cx="862" cy="245" r="11" fill="#041e42"/>
<text x="862" y="450" font-size="29" fill="#041e42" font-weight="600" text-anchor="middle">Firm boundary</text>
</svg>

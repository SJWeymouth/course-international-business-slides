<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Other local jobs created or lost for each job gained or lost, as cited by Broz, Frieden, and Weymouth</title>
<desc id="desc">A chart: each new job at an exporting firm in a thriving metro area brings 5 other local jobs; each manufacturing job lost in a declining region costs 1.6 more jobs, highlighted.</desc>
<rect width="1000" height="350" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">OTHER LOCAL JOBS PER JOB</text>
<text x="10" y="130" font-size="32" fill="#041e42">New job at an exporting firm in a thriving metro area</text>
<rect x="10" y="146" width="627.3" height="54" fill="#041e42"/>
<text x="653.3" y="186.0" font-size="32" font-weight="400" fill="#5b6672">+5 local jobs</text>
<text x="10" y="260" font-size="32" fill="#041e42">Manufacturing job lost in a declining region</text>
<rect x="10" y="276" width="200.7" height="54" fill="#8a7a5c"/>
<text x="226.7" y="316.0" font-size="32" font-weight="700" fill="#8a7a5c">1.6 more jobs lost</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Yearly pay for the same research work in the United States and Chennai, and income per person in Tamil Nadu, 2004, as Boo reports them</title>
<desc id="desc">A chart: a research job in the United States, up to 100,000 dollars; the same job in Chennai, 10,000 to 20,000 dollars, highlighted; income per person in Tamil Nadu, about 430 dollars.</desc>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">PAY A YEAR, 2004, THOUSAND U.S. DOLLARS</text>
<text x="10" y="130" font-size="36" fill="#041e42">Research job in the U.S.</text>
<rect x="10" y="146" width="660.0" height="54" fill="#041e42"/>
<text x="686.0" y="186.0" font-size="36" font-weight="400" fill="#5b6672">up to $100,000</text>
<text x="10" y="260" font-size="36" fill="#041e42">The same job in Chennai</text>
<rect x="10" y="276" width="132.0" height="54" fill="#8a7a5c"/>
<text x="158.0" y="316.0" font-size="36" font-weight="700" fill="#8a7a5c">$10,000 to $20,000</text>
<text x="10" y="390" font-size="36" fill="#041e42">Tamil Nadu income per person</text>
<rect x="10" y="406" width="6.0" height="54" fill="#041e42"/>
<text x="32.0" y="446.0" font-size="36" font-weight="400" fill="#5b6672">about $430</text>
</svg>

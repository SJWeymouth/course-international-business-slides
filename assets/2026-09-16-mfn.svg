<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="400" viewBox="0 0 1360 400" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, Helvetica Neue, Arial, sans-serif"><title id="title">MFN applies the same tariff to like goods</title><desc id="desc">Country A applies the negotiated 5 percent tariff to like goods from exporters B, C and D. Arrows depict imports into A. Rates are illustrative.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1f4e79"/></marker></defs><text x="40" y="38" font-size="30" fill="#041e42" font-weight="400" text-anchor="start">Illustration: A negotiates a tariff cut with B, from 10% to 5%</text><rect x="40" y="85" width="220" height="70" fill="#e5ecf3" stroke="none" stroke-width="2"/><text x="150" y="130" font-size="29" fill="#041e42" font-weight="400" text-anchor="middle">Exporter B</text><path d="M270 120L970 120" stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="570" y="104" font-size="28" fill="#1f4e79" font-weight="400" text-anchor="middle">Like goods: 5% tariff</text><rect x="40" y="190" width="220" height="70" fill="#e5ecf3" stroke="none" stroke-width="2"/><text x="150" y="235" font-size="29" fill="#041e42" font-weight="400" text-anchor="middle">Exporter C</text><path d="M270 225L970 225" stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="570" y="209" font-size="28" fill="#1f4e79" font-weight="400" text-anchor="middle">Like goods: 5% tariff</text><rect x="40" y="295" width="220" height="70" fill="#e5ecf3" stroke="none" stroke-width="2"/><text x="150" y="340" font-size="29" fill="#041e42" font-weight="400" text-anchor="middle">Exporter D</text><path d="M270 330L970 330" stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="570" y="314" font-size="28" fill="#1f4e79" font-weight="400" text-anchor="middle">Like goods: 5% tariff</text><rect x="990" y="85" width="320" height="280" fill="#041e42" stroke="none" stroke-width="2"/><text x="1150" y="190" font-size="27" fill="white" font-weight="600" text-anchor="middle">IMPORTING</text><text x="1150" y="230" font-size="32" fill="white" font-weight="700" text-anchor="middle">COUNTRY A</text><text x="1150" y="285" font-size="22" fill="white" font-weight="400" text-anchor="middle">Same product, same rate</text></svg>
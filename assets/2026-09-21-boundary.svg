<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-label="The same activities can be governed across or within a firm" font-family="Source Sans Pro, Arial, sans-serif">
<title>The same activities can be governed across or within a firm</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="25" y="38" font-size="26" fill="#1f4e79" font-weight="600">CONTRACTING BETWEEN FIRMS</text><rect x="25" y="62" width="370" height="155" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="110" font-size="28" fill="#1f4e79" font-weight="600">SUPPLIER</text><text x="49" y="162" font-size="31" fill="#041e42" font-weight="400">Makes the component</text><rect x="920" y="62" width="455" height="155" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="944" y="110" font-size="28" fill="#1f4e79" font-weight="600">BUYER</text><text x="944" y="162" font-size="31" fill="#041e42" font-weight="400">Negotiates changes</text><path d="M420 144 L895 144" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="565" y="123" font-size="30" fill="#041e42" font-weight="400">Contract</text><text x="25" y="276" font-size="26" fill="#1f4e79" font-weight="600">INTEGRATION</text><rect x="25" y="297" width="1350" height="187" fill="#f5f3ef" stroke="#041e42" stroke-width="3"/><text x="50" y="339" font-size="26" fill="#1f4e79" font-weight="600">ONE FIRM</text><text x="50" y="398" font-size="35" fill="#041e42" font-weight="400">Component unit</text><text x="995" y="398" font-size="35" fill="#041e42" font-weight="400">Assembly unit</text><path d="M370 390 L962 390" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="465" y="367" font-size="29" fill="#041e42" font-weight="400">Management directs adaptation</text></svg>
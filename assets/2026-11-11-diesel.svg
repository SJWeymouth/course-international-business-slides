<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">U.S. retail diesel and Brent crude oil prices, dollars per gallon, weekly, January 2025 to November 2026</title>
<desc id="desc">Two lines in dollars per gallon. U.S. retail diesel: about 3.45 to 3.90 through 2025, 3.81 on February 23, 2026, a record 6.53 on September 21, and 6.13 on November 9. Brent crude, highlighted, converted at 42 gallons a barrel: about 1.45 to 1.95 through 2025, 1.71 in the week to February 23, 2026, 2.93 in the week to September 21, a peak of 3.06 in the week to October 12, and 2.31 in the week to November 9. The gap between the two lines widens after February 2026. A dashed line marks the 2022 diesel record of 5.81. A grey point marks the U.S. regular gasoline price on November 9, 4.00.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Schematic comparison of the liberal order and techno-blocs</title>
<desc id="desc">Two schematic panels. The liberal order: twelve small circles, the states, in a ring, each joined to one central circle labeled rules; rules bind states, and any state may join. Techno-blocs: two separate clusters, each with a large circle, the lead state, joined to squares, the firms, and to small circles, the partner states, inside one boundary; four hollow circles sit outside both clusters; deals bind partners, firms sit inside, and others are shut out.</desc>

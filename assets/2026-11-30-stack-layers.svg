<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">The AI stack as a value chain of four steps, with the main firms at each</title>
<desc id="desc">Diagram of four cards in a row joined by arrows, each naming the main firms at one step of the AI value chain. Chips, the processors that do AI's arithmetic: Nvidia designs the chips in the United States, TSMC makes them in Taiwan, and ASML of the Netherlands builds the chip machines. Compute, data centers that run chips by the thousand: Amazon, Microsoft, and Google of the United States and Alibaba of China. Models, software trained on data to write, see, and plan: OpenAI and Anthropic of the United States and DeepSeek of China. Applications, the tools that people and firms use: ChatGPT, Copilot, and Waymo. A caption above recalls the Nespresso capsule: coffee and aluminum, capsule factory, boutiques, the cup.</desc>
<rect width="1600" height="560" fill="#ffffff"/>
<text x="12" y="40" font-size="24" fill="#5b6672"><tspan font-weight="700" fill="#1f4e79" letter-spacing="1.5">THE NESPRESSO CAPSULE, AUGUST 26:</tspan> coffee and aluminum  →  capsule factory  →  boutiques  →  the cup</text>

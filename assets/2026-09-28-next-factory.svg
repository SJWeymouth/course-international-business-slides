<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Where the next factory goes when coastal Chinese costs rise</title>
  <desc id="desc">From a central box labeled Pearl River Delta, solid arrows point to the interior provinces and to Vietnam or Cambodia. A dashed, crossed arrow points toward Ohio, showing that production does not return to the United States.</desc>
  <rect width="1600" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#52749a"/></marker>
    <marker id="arrow-grey" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#b3ada4"/></marker>
  </defs>

  <!-- origin -->
  <rect x="560" y="190" width="480" height="140" fill="#041e42"/>
  <text x="800" y="250" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">PEARL RIVER DELTA</text>
  <text x="800" y="296" text-anchor="middle" font-size="26" fill="#cdd9e6">costs rise</text>

  <!-- interior -->
  <path d="M560 235 L 400 130" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="50" width="330" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="225" y="96" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">INTERIOR PROVINCES</text>
  <text x="225" y="136" text-anchor="middle" font-size="27" fill="#041e42">lower pay, cheaper space</text>

  <!-- Vietnam -->
  <path d="M560 290 L 400 390" stroke="#52749a" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="360" width="330" height="110" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/>
  <text x="225" y="406" text-anchor="middle" font-size="26" font-weight="600" fill="#1f4e79" letter-spacing="1">VIETNAM, CAMBODIA</text>
  <text x="225" y="446" text-anchor="middle" font-size="27" fill="#041e42">the next factory</text>

  <!-- Ohio: dashed, blocked -->
  <path d="M1040 260 L 1200 260" stroke="#b3ada4" stroke-width="6" stroke-dasharray="14 12" fill="none" marker-end="url(#arrow-grey)"/>
  <line x1="1105" y1="220" x2="1155" y2="300" stroke="#8a7a5c" stroke-width="7"/>
  <line x1="1155" y1="220" x2="1105" y2="300" stroke="#8a7a5c" stroke-width="7"/>
  <rect x="1215" y="205" width="330" height="110" fill="#ffffff" stroke="#b3ada4" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1380" y="251" text-anchor="middle" font-size="26" font-weight="600" fill="#8a7a5c" letter-spacing="1">OHIO</text>
  <text x="1380" y="291" text-anchor="middle" font-size="27" fill="#5b6672">no cluster to return to</text>
</svg>

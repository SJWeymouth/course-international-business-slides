<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f75"/>
    </marker>
  </defs>

  <rect width="1500" height="700" fill="#ffffff"/>
  <text x="750" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#041e42">Many supply chains converge in one coffee capsule</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="205" y="105" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.4" fill="#365f91">CONVERGING INPUT CHAINS</text>

    <g fill="#f7f5f1" stroke="#8a7f75" stroke-width="3">
      <rect x="35" y="125" rx="10" ry="10" width="340" height="82"/>
      <rect x="35" y="220" rx="10" ry="10" width="340" height="82"/>
      <rect x="35" y="315" rx="10" ry="10" width="340" height="82"/>
      <rect x="35" y="410" rx="10" ry="10" width="340" height="82"/>
    </g>

    <g fill="#041e42" font-size="23" font-weight="700">
      <text x="55" y="157">Coffee</text>
      <text x="55" y="252">Aluminum capsule</text>
      <text x="55" y="347">Retail sleeve</text>
      <text x="55" y="442">Factory system</text>
    </g>
    <g fill="#4a5663" font-size="17">
      <text x="55" y="184">farms • mills • exporters</text>
      <text x="55" y="279">primary/recycled aluminum • body • foil lid</text>
      <text x="55" y="374">pulp • paperboard • ink • adhesive</text>
      <text x="55" y="469">machinery • energy • water • inspection</text>
    </g>

    <g fill="none" stroke="#8a7f75" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 375 166 C 420 166, 420 212, 465 226"/>
      <path d="M 375 261 C 420 261, 420 261, 465 261"/>
      <path d="M 375 356 C 420 356, 420 326, 465 318"/>
      <path d="M 375 451 C 420 451, 420 382, 465 362"/>
    </g>

    <rect x="470" y="170" rx="14" ry="14" width="300" height="300" fill="#eef2f7" stroke="#365f91" stroke-width="5"/>
    <text x="620" y="218" text-anchor="middle" font-size="29" font-weight="700" fill="#041e42">Capsule production</text>
    <line x1="505" y1="239" x2="735" y2="239" stroke="#c9d5e3" stroke-width="2"/>
    <g font-size="21" fill="#364452">
      <text x="510" y="278">Roast and blend coffee</text>
      <text x="510" y="320">Grind and fill capsule</text>
      <text x="510" y="362">Seal with aluminum lid</text>
      <text x="510" y="404">Pack capsules into sleeves</text>
    </g>

    <path d="M 770 320 L 820 320" fill="none" stroke="#8a7f75" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="830" y="205" rx="12" ry="12" width="190" height="230" fill="#f7f5f1" stroke="#8a7f75" stroke-width="4"/>
    <text x="925" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#041e42">Logistics</text>
    <g text-anchor="middle" font-size="19" fill="#364452">
      <text x="925" y="296">cases • pallets</text>
      <text x="925" y="330">transport • insurance</text>
      <text x="925" y="364">customs clearance</text>
    </g>

    <path d="M 1020 320 L 1060 320" fill="none" stroke="#8a7f75" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1070" y="205" rx="12" ry="12" width="190" height="230" fill="#f7f5f1" stroke="#365f91" stroke-width="4"/>
    <text x="1165" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#041e42">Distribution</text>
    <g text-anchor="middle" font-size="19" fill="#364452">
      <text x="1165" y="296">warehouses</text>
      <text x="1165" y="330">e-commerce</text>
      <text x="1165" y="364">boutiques • delivery</text>
    </g>

    <path d="M 1260 320 L 1295 320" fill="none" stroke="#8a7f75" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1305" y="205" rx="12" ry="12" width="160" height="230" fill="#041e42"/>
    <text x="1385" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Consumer</text>
    <g text-anchor="middle" font-size="19" fill="#dce4ed">
      <text x="1385" y="296">machine</text>
      <text x="1385" y="330">capsule</text>
      <text x="1385" y="364">taste • ease</text>
    </g>

    <rect x="85" y="555" rx="10" ry="10" width="1330" height="105" fill="#eef2f7" stroke="#dce4ed" stroke-width="3"/>
    <text x="750" y="596" text-anchor="middle" font-size="24" font-weight="700" fill="#041e42">Every connection depends on an institutional foundation</text>
    <text x="750" y="634" text-anchor="middle" font-size="22" fill="#365f91">prices • contracts • standards • finance • infrastructure • customs • regulation</text>
  </g>
</svg>

<title id="title">Natural gas prices in the United States and Europe and liquefied natural gas prices in Asia, 2005 to 2025</title>
<desc id="desc">Three lines in dollars per million British thermal units. The U.S. price (highlighted) stays between about 2 and 9 dollars and was 3.6 in 2025. Europe and Asia were usually two to five times higher, reaching 37.5 and 33.3 in 2022 and about 12 in 2025.</desc>

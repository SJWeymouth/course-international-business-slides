<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="485" viewBox="0 0 1400 485" role="img" aria-label="Licensing and internalization organize knowledge differently" font-family="Source Sans Pro, Arial, sans-serif"><title>Licensing and internalization organize knowledge differently</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="25" y="35" font-size="27" fill="#1f4e79" font-weight="600">LICENSE TO AN INDEPENDENT FIRM</text><rect x="25" y="60" width="360" height="155" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="107" font-size="27" fill="#1f4e79" font-weight="600">KNOWLEDGE OWNER</text><text x="49" y="157" font-size="31" fill="#041e42" font-weight="400">Shares a process</text><rect x="935" y="60" width="440" height="155" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="959" y="107" font-size="27" fill="#1f4e79" font-weight="600">LICENSEE</text><text x="959" y="157" font-size="31" fill="#041e42" font-weight="400">Applies it under contract</text><path d="M409 141 L910 141" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="490" y="118" font-size="30" fill="#041e42" font-weight="400">Terms, fees, monitoring</text><text x="25" y="280" font-size="27" fill="#1f4e79" font-weight="600">INTERNALIZE THE FOREIGN ACTIVITY</text><rect x="25" y="301" width="1350" height="160" fill="#f5f3ef" stroke="#041e42" stroke-width="3"/><text x="50" y="352" font-size="27" fill="#1f4e79" font-weight="600">HOME TEAM</text><text x="50" y="414" font-size="31" fill="#041e42" font-weight="400">Develops the process</text><text x="995" y="352" font-size="27" fill="#1f4e79" font-weight="600">FOREIGN AFFILIATE</text><text x="995" y="414" font-size="31" fill="#041e42" font-weight="400">Adapts the process</text><path d="M408 392 L955 392" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="493" y="369" font-size="30" fill="#041e42" font-weight="400">Shared management</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Global integration against local responsiveness</title>
  <desc id="desc">A grid with global integration on the vertical axis and local responsiveness on the horizontal axis. Wal-Mart Germany sits high on integration and low on responsiveness. Asda sits high on both. Apple China Ops sits high on integration and low on responsiveness, with a dashed marker toward responsiveness labeled a country face.</desc>
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- axes -->
  <line x1="130" y1="520" x2="960" y2="520" stroke="#4a5663" stroke-width="4"/>
  <line x1="130" y1="520" x2="130" y2="40" stroke="#4a5663" stroke-width="4"/>
  <text x="545" y="578" text-anchor="middle" font-size="30" font-weight="600" fill="#1f4e79" letter-spacing="1.2">LOCAL RESPONSIVENESS</text>
  <text x="150" y="552" font-size="24" fill="#4a5663">low</text>
  <text x="950" y="552" text-anchor="end" font-size="24" fill="#4a5663">high</text>
  <text x="50" y="280" text-anchor="middle" font-size="30" font-weight="600" fill="#1f4e79" letter-spacing="1.2" transform="rotate(-90 50 280)">GLOBAL INTEGRATION</text>
  <text x="110" y="512" text-anchor="end" font-size="24" fill="#4a5663">low</text>
  <text x="110" y="60" text-anchor="end" font-size="24" fill="#4a5663">high</text>

  <!-- grid lines -->
  <line x1="545" y1="520" x2="545" y2="40" stroke="#cdd9e6" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="130" y1="330" x2="960" y2="330" stroke="#cdd9e6" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Wal-Mart Germany -->
  <rect x="160" y="70" width="350" height="100" fill="#b3a394"/>
  <text x="335" y="113" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">WAL-MART GERMANY</text>
  <text x="335" y="150" text-anchor="middle" font-size="24" fill="#ffffff">formula imposed</text>

  <!-- Asda -->
  <rect x="590" y="70" width="350" height="100" fill="#041e42"/>
  <text x="765" y="113" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">ASDA</text>
  <text x="765" y="150" text-anchor="middle" font-size="24" fill="#ffffff">local front, global back</text>

  <!-- Apple -->
  <rect x="160" y="200" width="350" height="100" fill="#365f91"/>
  <text x="335" y="243" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">APPLE CHINA OPS</text>
  <text x="335" y="280" text-anchor="middle" font-size="24" fill="#ffffff">global functions</text>
  <line x1="510" y1="250" x2="590" y2="250" stroke="#8a7a5c" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="590" y="215" width="260" height="70" fill="#ffffff" stroke="#8a7a5c" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="720" y="259" text-anchor="middle" font-size="24" font-weight="700" fill="#8a7a5c">a country face</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Gulf producers' share of world exports of fertilizers and sulfur, 2023 to 2025</title>
<desc id="desc">A chart in percent of world exports from Gulf producers: sulfur about 50; urea 36, highlighted; ammonia 29; diammonium phosphate 26; monoammonium phosphate 13.</desc>
<rect width="1000" height="610" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">GULF PRODUCERS' SHARE OF WORLD EXPORTS, PERCENT</text>
<text x="10" y="126" font-size="34" fill="#041e42">Sulfur</text>
<rect x="10" y="140" width="633.3" height="50" fill="#041e42"/>
<text x="659.3" y="178.0" font-size="34" font-weight="400" fill="#5b6672">about 50</text>
<text x="10" y="230" font-size="34" fill="#041e42">Urea</text>
<rect x="10" y="244" width="456.0" height="50" fill="#8a7a5c"/>
<text x="482.0" y="282.0" font-size="34" font-weight="700" fill="#8a7a5c">36</text>
<text x="10" y="334" font-size="34" fill="#041e42">Ammonia</text>
<rect x="10" y="348" width="367.3" height="50" fill="#041e42"/>
<text x="393.3" y="386.0" font-size="34" font-weight="400" fill="#5b6672">29</text>
<text x="10" y="438" font-size="34" fill="#041e42">Diammonium phosphate</text>
<rect x="10" y="452" width="329.3" height="50" fill="#041e42"/>
<text x="355.3" y="490.0" font-size="34" font-weight="400" fill="#5b6672">26</text>
<text x="10" y="542" font-size="34" fill="#041e42">Monoammonium phosphate</text>

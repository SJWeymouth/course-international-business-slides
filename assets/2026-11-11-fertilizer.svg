<title id="title">World prices of urea and diammonium phosphate, January 2025 to October 2026, indexed to February 2026 = 100</title>
<desc id="desc">Two lines indexed to February 2026 = 100, when urea cost 472 dollars a ton and diammonium phosphate 627. Urea, in navy, jumps to 182 in April 2026 and falls to 89 by October. Diammonium phosphate, highlighted, rises steadily to 128 in October.</desc>

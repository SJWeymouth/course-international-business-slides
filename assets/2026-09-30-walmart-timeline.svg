<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Wal-Mart's international expansion, 1992 to 2006</title>
  <desc id="desc">A timeline with entries into Mexico in 1992, Canada in 1994, Germany in 1998, Britain in 1999, Brazil's Bompreço in 2004, and Sonae, Seiyu, and Central America in 2005, followed by the sale of the Korean stores in May 2006 and the exit from Germany in July 2006, marked in taupe.</desc>
  <rect width="1600" height="460" fill="#ffffff"/>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="36" markerHeight="36" refX="30" refY="18" orient="auto"><path d="M0,0 L36,18 L0,36 z" fill="#7f95b2"/></marker></defs>

  <line x1="60" y1="230" x2="1585" y2="230" stroke="#9cadc4" stroke-width="10" marker-end="url(#arrow)"/>

  <g text-anchor="middle">
    <g transform="translate(130 230)">
      <circle r="20" fill="#041e42"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">1992</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">MEXICO</text>
      <text y="104" font-size="22" fill="#4a5663">Cifra</text>
    </g>
    <g transform="translate(310 230)">
      <circle r="20" fill="#041e42"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">1994</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">CANADA</text>
    </g>
    <g transform="translate(490 230)">
      <circle r="20" fill="#365f91"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">1998</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">GERMANY</text>
      <text y="104" font-size="22" fill="#4a5663">Wertkauf, Interspar</text>
    </g>
    <g transform="translate(670 230)">
      <circle r="20" fill="#365f91"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">1999</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">BRITAIN</text>
      <text y="104" font-size="22" fill="#4a5663">Asda</text>
    </g>
    <g transform="translate(850 230)">
      <circle r="20" fill="#7f95b2"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">2004</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">BRAZIL</text>
      <text y="104" font-size="22" fill="#4a5663">Bompreço</text>
    </g>
    <g transform="translate(1030 230)">
      <circle r="20" fill="#7f95b2"/>
      <text y="-60" font-size="30" font-weight="700" fill="#041e42">2005</text>
      <text y="70" font-size="26" font-weight="700" fill="#041e42">545 STORES</text>
      <text y="104" font-size="22" fill="#4a5663">Sonae, Seiyu, Carcho</text>
    </g>
    <g transform="translate(1240 230)">
      <circle r="22" fill="#b3a394"/>
      <text y="-60" font-size="30" font-weight="700" fill="#8a7a5c">May 2006</text>
      <text y="70" font-size="26" font-weight="700" fill="#8a7a5c">KOREA SOLD</text>
    </g>
    <g transform="translate(1460 230)">
      <circle r="22" fill="#b3a394"/>
      <text y="-60" font-size="30" font-weight="700" fill="#8a7a5c">July 2006</text>
      <text y="70" font-size="26" font-weight="700" fill="#8a7a5c">GERMANY EXIT</text>
    </g>
  </g>
</svg>

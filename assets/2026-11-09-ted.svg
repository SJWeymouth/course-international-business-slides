<title id="title">TED spread: three-month bank borrowing rate minus three-month Treasury bill rate, daily, 2006 to 2010, percentage points</title>
<desc id="desc">A line in percentage points: under 0.6 through mid-2007, a jump to 2.4 in August 2007, about 1 to 2 through mid-2008, then a spike after Lehman failed on September 15, 2008 to a peak of 4.58 on October 10, 2008, highlighted, falling below 1.5 by the end of 2008 and below 0.5 in mid-2009.</desc>

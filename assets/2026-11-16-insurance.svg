<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="380" viewBox="0 0 1500 380" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Two insurance disputes over NotPetya losses</title>
<desc id="desc">A table. Mondelez against Zurich: about 100 million dollars claimed; settled in 2022. Merck against Ace American: about 1.4 billion dollars in dispute; a New Jersey appeals court rejected the war exclusion in 2023; settled in 2024.</desc>
<rect width="1500" height="380" fill="#ffffff"/>
<text x="10" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">CLAIM</text>
<text x="520" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">AMOUNT</text>
<text x="860" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">OUTCOME</text>
<line x1="10" y1="70" x2="1490" y2="70" stroke="#041e42" stroke-width="3"/>
<text x="10" y="140" font-size="34" fill="#041e42">Mondelez v. Zurich</text>
<text x="520" y="140" font-size="34" fill="#5b6672">about $100 million</text>
<text x="860" y="140" font-size="34" font-weight="400" fill="#041e42">Settled, 2022</text>
<text x="10" y="250" font-size="34" fill="#041e42">Merck v. Ace American</text>
<text x="520" y="250" font-size="34" fill="#5b6672">about $1.4 billion</text>
<text x="860" y="250" font-size="34" font-weight="700" fill="#8a7a5c">War clause rejected, 2023</text>
<text x="10" y="300" font-size="34" fill="#041e42"></text>
<text x="520" y="300" font-size="34" fill="#5b6672"></text>
<text x="860" y="300" font-size="34" font-weight="400" fill="#041e42">Settled, 2024</text>
<line x1="10" y1="185" x2="1490" y2="185" stroke="#cdd9e6" stroke-width="2"/>
<line x1="10" y1="345" x2="1490" y2="345" stroke="#cdd9e6" stroke-width="2"/>
</svg>

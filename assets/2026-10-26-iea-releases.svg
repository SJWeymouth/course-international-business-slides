<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">IEA EMERGENCY STOCK RELEASES, MILLION BARRELS</text>
<text x="10" y="130" font-size="34" fill="#041e42">2005, Hurricane Katrina</text>
<rect x="10" y="144" width="108.6" height="50" fill="#041e42"/>

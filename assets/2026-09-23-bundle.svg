<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-label="Foxconn bundles tooling, components, and assembly" font-family="Source Sans Pro, Arial, sans-serif"><title>Foxconn bundles tooling, components, and assembly</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><rect x="25" y="100" width="390" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="147" font-size="27" fill="#1f4e79" font-weight="600">UP-FRONT OFFER</text><text x="49" y="197" font-size="31" fill="#041e42" font-weight="400">Foxconn funds</text><text x="49" y="239" font-size="31" fill="#041e42" font-weight="400">custom production tools</text><text x="49" y="281" font-size="31" fill="#041e42" font-weight="400">Apple buys finished parts</text><rect x="515" y="100" width="355" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="539" y="147" font-size="27" fill="#1f4e79" font-weight="600">ONGOING REVENUE</text><text x="539" y="197" font-size="31" fill="#041e42" font-weight="400">Component sourcing</text><text x="539" y="239" font-size="31" fill="#041e42" font-weight="400">Manufacturing</text><text x="539" y="281" font-size="31" fill="#041e42" font-weight="400">Logistics</text><rect x="970" y="100" width="405" height="235" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="994" y="147" font-size="27" fill="#1f4e79" font-weight="600">DEPENDENCE</text><text x="994" y="197" font-size="31" fill="#041e42" font-weight="400">Foxconn recovers costs</text><text x="994" y="239" font-size="31" fill="#041e42" font-weight="400">Apple faces a more</text><text x="994" y="281" font-size="31" fill="#041e42" font-weight="400">costly supplier switch</text><path d="M437 218 L490 218" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M892 218 L945 218" stroke="#52749a" stroke-width=
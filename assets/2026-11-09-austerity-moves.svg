<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Structural budget balance after the financial crisis, largest deficit and smallest deficit, 2007 to 2017, percent of potential GDP</title>
<desc id="desc">For ten countries, an arrow from the largest structural deficit after 2007 to the smallest that followed, approximate: Greece from minus 12 to plus 5, Spain minus 11 to minus 2, Portugal minus 9 to minus 1, United Kingdom minus 9 to minus 2 and United States minus 9 to minus 3, both highlighted, Japan minus 8 to minus 3, Canada minus 4 to plus 1, France minus 6 to minus 3, Italy minus 4 to minus 1, Germany minus 2 to plus 1.</desc>
<rect width="1000" height="745" fill="#ffffff"/>
<text x="10" y="46" font-size="28" font-weight="600" letter-spacing="1.2" fill="#1f4e79">STRUCTURAL BUDGET BALANCE, PERCENT OF POTENTIAL GDP</text>
<line x1="322.0" y1="155" x2="322.0" y2="705" stroke="#cdd9e6" stroke-width="2"/>
<text x="322.0" y="143" text-anchor="middle" font-size="28" fill="#5b6672">-12</text>
<line x1="466.0" y1="155" x2="466.0" y2="705" stroke="#cdd9e6" stroke-width="2"/>
<text x="466.0" y="143" text-anchor="middle" font-size="28" fill="#5b6672">-8</text>
<line x1="610.0" y1="155" x2="610.0" y2="705" stroke="#cdd9e6" stroke-width="2"/>
<text x="610.0" y="143" text-anchor="middle" font-size="28" fill="#5b6672">-4</text>
<line x1="754.0" y1="155" x2="754.0" y2="705" stroke="#5b6672" stroke-width="3"/>
<text x="754.0" y="143" text-anchor="middle" font-size="28" fill="#5b6672">0</text>
<line x1="898.0" y1="155" x2="898.0" y2="705" stroke="#cdd9e6" stroke-width="2"/>
<text x="898.0" y="143" text-anchor="middle" font-size="28" fill="#5b6672">+4</text>
<text x="268.0" y="103" font-size="26" fill="#5b6672">← deficit</text>
<text x="962.8" y="103" text-anchor="end" font-size="26" fill="#5b6672">surplus →</text>

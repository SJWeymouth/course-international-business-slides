<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Container route from Malaysia to Cincinnati</title>
  <desc id="desc">Factory, ship, train, and truck stages cover 11,000 miles in 28 days.</desc>
  <rect width="1600" height="620" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7f95b2"/></marker></defs>
  <path d="M210 300 H1420" stroke="#9cadc4" stroke-width="8" marker-end="url(#a)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(210 300)"><circle r="82" fill="#041e42"/><path d="M-42 32 V-18 L-8 -42 V-18 L26 -42 V32 Z" fill="#fff"/><rect x="34" y="-54" width="18" height="86" fill="#fff"/><text y="142" font-size="30" font-weight="700" fill="#041e42">MALAYSIA</text><text y="178" font-size="23" fill="#4a5663">factory gate</text></g>
    <g transform="translate(620 300)"><circle r="82" fill="#365f91"/><path d="M-50 16 H50 L32 42 H-34 Z" fill="#fff"/><rect x="-28" y="-24" width="56" height="34" fill="#fff"/><text y="142" font-size="30" font-weight="700" fill="#041e42">LOS ANGELES</text><text y="178" font-size="23" fill="#4a5663">23 days · 9,000 miles by sea</text></g>
    <g transform="translate(1010 300)"><circle r="82" fill="#7f95b2"/><rect x="-52" y="-22" width="104" height="48" rx="5" fill="#fff"/><rect x="-40" y="-10" width="24" height="18" fill="#7f95b2"/><rect x="-7" y="-10" width="24" height="18" fill="#7f95b2"/><circle cx="-30" cy="36" r="12" fill="#fff"/><circle cx="30" cy="36" r="12" fill="#fff"/><text y="142" font-size="30" font-weight="700" fill="#041e42">CHICAGO</text><text y="178" font-size="23" fill="#4a5663">unit train</text></g>
    <g transform="translate(1385 300)"><circle r="82" fill="#b3a394"/><rect x="-55" y="-24" width="76" height="54" fill="#fff"/><path d="M21 -8 H50 L62 10 V30 H21 Z" fill="#fff"/><circle cx="-30" cy="38" r="12" fill="#fff"/><circle cx="42" cy="38" r="12" fill="#fff"/><text y="142" font-size="30" font-weight="700" fill="#041e42">CINCINNATI</text><text y="178" font-size="23" fill="#4a5663">warehouse · day 28</text></g>
    <text x="800" y="80" font-size="48" font-weight="700" fill="#041e42">11,000 miles · 28 days · one sealed container</text>
  </g>
</svg>

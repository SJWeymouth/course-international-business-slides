<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Events from 2025 and 2026 that moved away from the market-driven model or pushed back toward it</title>
<desc id="desc">A timeline from 2025 to 2027. Above the line, moves away from the market model: December 2025, Australia bars children under 16 from social media accounts; September 2026, the EU proposes a minimum age of 15; October 2026, about two dozen U.S. states have privacy laws. Below the line, pushing back: February 2025, the White House threatens tariffs over digital fines; December 2025, the United States bars a former EU commissioner; July 2026, the EU delays its rules for high-risk AI.</desc>
<rect width="1600" height="600" fill="#ffffff"/>
<text x="20" y="40" font-size="28" font-weight="700" fill="#1f4e79" text-anchor="start" letter-spacing="1.2">AWAY FROM THE MARKET MODEL</text>
<text x="20" y="584" font-size="28" font-weight="700" fill="#8a7a5c" text-anchor="start" letter-spacing="1.2">PUSHING BACK</text>
<line x1="20" y1="300" x2="1580" y2="300" stroke="#5b6672" stroke-width="4"/>
<line x1="150.0" y1="288" x2="150.0" y2="312" stroke="#5b6672" stroke-width="4"/>
<text x="158.0" y="334" font-size="24" font-weight="700" fill="#5b6672" text-anchor="start">2025</text>
<line x1="800.0" y1="288" x2="800.0" y2="312" stroke="#5b6672" stroke-width="4"/>
<text x="808.0" y="334" font-size="24" font-weight="700" fill="#5b6672" text-anchor="start">2026</text>
<line x1="1450.0" y1="288" x2="1450.0" y2="312" stroke="#5b6672" stroke-width="4"/>
<text x="1458.0" y="334" font-size="24" font-weight="700" fill="#5b6672" text-anchor="start">2027</text>
<line x1="761.0" y1="300" x2="761.0" y2="244.0" stroke="#1f4e79" stroke-width="3"/>
<text x="761.0" y="140" font-size="24" font-weight="700" fill="#1f4e79" text-anchor="middle" letter-spacing="1">DEC 2025</text>
<text x="761.0" y="172" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">Australia bars</text>
<text x="761.0" y="204" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">under-16s from</text>
<text x="761.0" y="236" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">social media</text>
<circle cx="761.0" cy="300" r="12" fill="#1f4e79"/>
<line x1="1261.5" y1="300" x2="1261.5" y2="124.0" stroke="#1f4e79" stroke-width="3"/>
<text x="1261.5" y="20" font-size="24" font-weight="700" fill="#1f4e79" text-anchor="middle" letter-spacing="1">SEP 2026</text>
<text x="1261.5" y="52" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">EU proposes a</text>
<text x="1261.5" y="84" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">minimum age</text>
<text x="1261.5" y="116" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">of 15</text>
<circle cx="1261.5" cy="300" r="12" fill="#1f4e79"/>
<line x1="1333.0" y1="300" x2="1333.0" y2="118.0" stroke="#1f4e79" stroke-width="3"/>
<text x="1347.0" y="140" font-size="24" font-weight="700" fill="#1f4e79" text-anchor="start" letter-spacing="1">OCT 2026</text>
<text x="1347.0" y="172" font-size="26" font-weight="400" fill="#041e42" text-anchor="start">About two dozen</text>
<text x="1347.0" y="204" font-size="26" font-weight="400" fill="#041e42" text-anchor="start">U.S. states have</text>
<text x="1347.0" y="236" font-size="26" font-weight="400" fill="#041e42" text-anchor="start">privacy laws</text>
<circle cx="1333.0" cy="300" r="12" fill="#1f4e79"/>
<line x1="241.0" y1="300" x2="241.0" y2="364.0" stroke="#8a7a5c" stroke-width="3"/>
<text x="241.0" y="392" font-size="24" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">FEB 2025</text>
<text x="241.0" y="424" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">White House</text>
<text x="241.0" y="456" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">threatens tariffs</text>
<text x="241.0" y="488" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">over digital fines</text>
<circle cx="241.0" cy="300" r="12" fill="#8a7a5c"/>
<line x1="787.0" y1="300" x2="787.0" y2="454.0" stroke="#8a7a5c" stroke-width="3"/>
<text x="787.0" y="482" font-size="24" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">DEC 2025</text>
<text x="787.0" y="514" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">U.S. bars a former</text>
<text x="787.0" y="546" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">EU commissioner</text>
<circle cx="787.0" cy="300" r="12" fill="#8a7a5c"/>
<line x1="1164.0" y1="300" x2="1164.0" y2="364.0" stroke="#8a7a5c" stroke-width="3"/>
<text x="1164.0" y="392" font-size="24" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">JUL 2026</text>
<text x="1164.0" y="424" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">EU delays rules</text>
<text x="1164.0" y="456" font-size="26" font-weight="400" fill="#041e42" text-anchor="middle">for high-risk AI</text>
<circle cx="1164.0" cy="300" r="12" fill="#8a7a5c"/>
</svg>

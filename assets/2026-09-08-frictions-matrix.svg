<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Matrix for classifying physical and border frictions</title>
  <desc id="desc">A blank two-by-two matrix with physical difficulty on the vertical axis and border friction on the horizontal axis.</desc>
  <rect width="1600" height="700" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="190" y="70" width="1280" height="510" fill="#f7f8fa" stroke="#9cadc4" stroke-width="4"/>
    <line x1="830" y1="70" x2="830" y2="580" stroke="#9cadc4" stroke-width="4"/>
    <line x1="190" y1="325" x2="1470" y2="325" stroke="#9cadc4" stroke-width="4"/>
    <text x="830" y="665" text-anchor="middle" font-size="29" font-weight="700" fill="#041e42">BORDER FRICTION</text>
    <text x="205" y="620" font-size="22" fill="#4a5663">LOW</text><text x="1415" y="620" font-size="22" fill="#4a5663">HIGH</text>
    <text x="120" y="325" text-anchor="middle" transform="rotate(-90 120 325)" font-size="29" font-weight="700" fill="#041e42">PHYSICAL DIFFICULTY</text>
    <text x="160" y="95" text-anchor="end" font-size="22" fill="#4a5663">LOW</text><text x="160" y="575" text-anchor="end" font-size="22" fill="#4a5663">HIGH</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="702" viewBox="0 0 1000 702" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Share of each country's manufactured exports by industry, China and the United States, 2005, industries ordered by labor's share of value added</title>
<desc id="desc">Paired horizontal bars for ten industries from textiles, apparel, and leather at the top to refined petroleum at the bottom; China is 21 percent in textiles against 3 for the United States, and 32 percent in computers and electronics against 18; the United States is larger in machinery, motor vehicles, aircraft, chemicals, and pharmaceuticals.</desc>
<rect width="1000" height="702" fill="#ffffff"/>
<text x="440" y="36" font-size="34" font-weight="600" letter-spacing="1.2" fill="#1f4e79">PERCENT OF EXPORTS, 2005</text>

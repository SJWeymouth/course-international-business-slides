<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="490" viewBox="0 0 1400 490" role="img" aria-label="Foreign investment can serve customers or divide production stages" font-family="Source Sans Pro, Arial, sans-serif"><title>Foreign investment can serve customers or divide production stages</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="25" y="35" font-size="27" fill="#1f4e79" font-weight="600">SERVE A FOREIGN MARKET</text><rect x="25" y="65" width="390" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="112" font-size="27" fill="#1f4e79" font-weight="600">HOME CAPABILITY</text><text x="49" y="162" font-size="31" fill="#041e42" font-weight="400">Product and process</text><rect x="535" y="65" width="375" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="559" y="112" font-size="27" fill="#1f4e79" font-weight="600">FOREIGN AFFILIATE</text><text x="559" y="162" font-size="31" fill="#041e42" font-weight="400">Produces locally</text><rect x="1020" y="65" width="355" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="1044" y="112" font-size="27" fill="#1f4e79" font-weight="600">CUSTOMERS</text><text x="1044" y="162" font-size="31" fill="#041e42" font-weight="400">Buy in that market</text><path d="M437 144 L510 144" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M932 144 L995 144" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="25" y="285" font-size="27" fill="#1f4e79" font-weight="600">CONNECT PRODUCTION STAGES</text><rect x="25" y="315" width="390" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="49" y="362" font-size="27" fill="#1f4e79" font-weight="600">HOME ACTIVITY</text><text x="49" y="412" font-size="31" fill="#041e42" font-weight="400">Design or components</text><rect x="535" y="315" width="375" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="559" y="362" font-size="27" fill="#1f4e79" font-weight="600">FOREIGN AFFILIATE</text><text x="559" y="412" font-size="31" fill="#041e42" font-weight="400">Performs another stage</text><rect x="1020" y="315" width="355" height="150" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="1044" y="362" font-size="27" fill="#1f4e79" font-weight="600">CUSTOMERS</text><text x="1044" y="412" font-size="31" fill="#041e42" font-weight="400">Buy across markets</text><path d="M437 393 L510 393" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M932 393 L995 393" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/></svg>
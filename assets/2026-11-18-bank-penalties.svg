<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Penalties paid by six European banks to U.S. authorities, and the countries or crimes involved</title>
<desc id="desc">A chart in billions of dollars: BNP Paribas, France, 2014, Sudan, Iran, Cuba, 8.97, highlighted; HSBC, Britain, 2012, drug cartels and Iran, 1.92; Commerzbank, Germany, 2015, Iran, Sudan, and failing to flag the Olympus fraud, 1.45; Société Générale, France, 2018, Cuba and Iran, 1.34; Crédit Agricole, France, 2015, Sudan, Iran, Cuba, 0.79; ING, Netherlands, 2012, Cuba and Iran, 0.62.</desc>
<rect width="1100" height="690" fill="#ffffff"/>
<text x="10" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">PAID TO U.S. AUTHORITIES, BILLIONS OF DOLLARS</text>
<text x="10" y="126" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">BNP Paribas (France), 2014 · Sudan, Iran, Cuba</text>
<rect x="10" y="138" width="834.2" height="46" fill="#8a7a5c"/>
<text x="860.2" y="173.0" font-size="30" font-weight="700" fill="#8a7a5c" text-anchor="start">$8.97</text>
<text x="10" y="226" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">HSBC (Britain), 2012 · drug cartels, Iran</text>
<rect x="10" y="238" width="178.6" height="46" fill="#041e42"/>
<text x="204.6" y="273.0" font-size="30" font-weight="400" fill="#5b6672" text-anchor="start">$1.92</text>
<text x="10" y="326" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">Commerzbank (Germany), 2015 · Iran, Sudan, failing to flag a fraud</text>
<rect x="10" y="338" width="134.8" height="46" fill="#041e42"/>
<text x="160.8" y="373.0" font-size="30" font-weight="400" fill="#5b6672" text-anchor="start">$1.45</text>
<text x="10" y="426" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">Société Générale (France), 2018 · Cuba, Iran</text>
<rect x="10" y="438" width="124.6" height="46" fill="#041e42"/>
<text x="150.6" y="473.0" font-size="30" font-weight="400" fill="#5b6672" text-anchor="start">$1.34</text>
<text x="10" y="526" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">Crédit Agricole (France), 2015 · Sudan, Iran, Cuba</text>
<rect x="10" y="538" width="73.5" height="46" fill="#041e42"/>
<text x="99.5" y="573.0" font-size="30" font-weight="400" fill="#5b6672" text-anchor="start">$0.79</text>
<text x="10" y="626" font-size="30" font-weight="400" fill="#041e42" text-anchor="start">ING (Netherlands), 2012 · Cuba, Iran</text>
<rect x="10" y="638" width="57.7" height="46" fill="#041e42"/>
<text x="83.7" y="673.0" font-size="30" font-weight="400" fill="#5b6672" text-anchor="start">$0.62</text>
</svg>

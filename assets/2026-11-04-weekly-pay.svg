<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Weekly pay of textile workers in Cameron County, Honduras, and China, as Boo reports it</title>
<desc id="desc">A chart: Cameron County, Fruit of the Loom, about 400 dollars; Honduras, under 75 dollars, highlighted; China, about 17 dollars (75 dollars a month).</desc>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">PAY A WEEK, TEXTILE WORKERS, 2003</text>
<text x="10" y="130" font-size="36" fill="#041e42">Cameron County, Fruit of the Loom</text>
<rect x="10" y="146" width="627.3" height="54" fill="#041e42"/>
<text x="653.3" y="186.0" font-size="36" font-weight="400" fill="#5b6672">about $400</text>
<text x="10" y="260" font-size="36" fill="#041e42">Honduras</text>
<rect x="10" y="276" width="117.6" height="54" fill="#8a7a5c"/>
<text x="143.6" y="316.0" font-size="36" font-weight="700" fill="#8a7a5c">under $75</text>
<text x="10" y="390" font-size="36" fill="#041e42">China</text>
<rect x="10" y="406" width="27.1" height="54" fill="#041e42"/>
<text x="53.1" y="446.0" font-size="36" font-weight="400" fill="#5b6672">about $17</text>
</svg>

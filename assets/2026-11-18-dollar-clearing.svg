<rect x="500.0" y="44" width="600" height="52" fill="#ffffff"/>
<text x="800.0" y="81" font-size="28" font-weight="700" fill="#1f4e79" text-anchor="middle" letter-spacing="1">SWIFT MESSAGES: PAY $10 MILLION</text>
<text x="800.0" y="391" font-size="28" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">U.S. REGULATORS CAN SEE AND STOP THIS STEP</text>
<line x1="15.0" y1="381" x2="65.0" y2="381" stroke="#8a7a5c" stroke-width="6"/>

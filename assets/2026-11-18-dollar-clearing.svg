<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">How a dollar payment from a German refinery to a Saudi oil producer runs through New York</title>
<desc id="desc">Diagram of six boxes in a row, linked by highlighted money arrows: a refinery and its bank in Germany; inside a dashed frame labeled New York, where U.S. regulators can see and stop the payment, the German bank's U.S. bank pays the Saudi bank's U.S. bank through CHIPS; then a bank and an oil producer in Saudi Arabia. A dashed blue line above carries SWIFT messages, labeled pay 10 million dollars, from the German bank to the New York banks and the Saudi bank.</desc>
<rect width="1600" height="410" fill="#ffffff"/>
<rect x="473.0" y="155" width="654.0" height="194" fill="#f6f1e7" stroke="#8a7a5c" stroke-width="4" stroke-dasharray="14 9"/>
<rect x="15.0" y="215" width="200" height="110" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<text x="115.0" y="280" font-size="28" font-weight="600" fill="#041e42" text-anchor="middle">Refinery</text>
<rect x="255.0" y="215" width="200" height="110" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<text x="355.0" y="280" font-size="28" font-weight="600" fill="#041e42" text-anchor="middle">Its bank</text>
<rect x="495.0" y="215" width="245" height="110" fill="#ffffff" stroke="#8a7a5c" stroke-width="4"/>
<text x="617.5" y="263" font-size="26" font-weight="600" fill="#041e42" text-anchor="middle">German bank’s</text>
<text x="617.5" y="299" font-size="26" font-weight="600" fill="#041e42" text-anchor="middle">U.S. bank</text>
<rect x="860.0" y="215" width="245" height="110" fill="#ffffff" stroke="#8a7a5c" stroke-width="4"/>
<text x="982.5" y="263" font-size="26" font-weight="600" fill="#041e42" text-anchor="middle">Saudi bank’s</text>
<text x="982.5" y="299" font-size="26" font-weight="600" fill="#041e42" text-anchor="middle">U.S. bank</text>
<rect x="1145.0" y="215" width="200" height="110" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<text x="1245.0" y="280" font-size="28" font-weight="600" fill="#041e42" text-anchor="middle">Its bank</text>
<rect x="1385.0" y="215" width="200" height="110" fill="#ffffff" stroke="#041e42" stroke-width="4"/>
<text x="1485.0" y="280" font-size="28" font-weight="600" fill="#041e42" text-anchor="middle">Oil producer</text>
<line x1="219.0" y1="270.0" x2="233.0" y2="270.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="251.0,270.0 233.0,282.6 233.0,257.4" fill="#8a7a5c"/>
<line x1="459.0" y1="270.0" x2="473.0" y2="270.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="491.0,270.0 473.0,282.6 473.0,257.4" fill="#8a7a5c"/>
<line x1="744.0" y1="270.0" x2="838.0" y2="270.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="856.0,270.0 838.0,282.6 838.0,257.4" fill="#8a7a5c"/>
<line x1="1109.0" y1="270.0" x2="1123.0" y2="270.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="1141.0,270.0 1123.0,282.6 1123.0,257.4" fill="#8a7a5c"/>
<line x1="1349.0" y1="270.0" x2="1363.0" y2="270.0" stroke="#8a7a5c" stroke-width="6"/>
<polygon points="1381.0,270.0 1363.0,282.6 1363.0,257.4" fill="#8a7a5c"/>
<text x="800.0" y="254.0" font-size="22" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1">CHIPS</text>
<text x="235.0" y="193" font-size="28" font-weight="700" fill="#1f4e79" text-anchor="middle" letter-spacing="1.5">GERMANY</text>
<text x="800.0" y="193" font-size="28" font-weight="700" fill="#8a7a5c" text-anchor="middle" letter-spacing="1.5">NEW YORK</text>
<text x="1365.0" y="193" font-size="28" font-weight="700" fill="#1f4e79" text-anchor="middle" letter-spacing="1.5">SAUDI ARABIA</text>
<polyline points="410.0,211 410.0,70 1190.0,70 1190.0,185" fill="none" stroke="#1f4e79" stroke-width="4" stroke-dasharray="10 8"/>
<line x1="1190.0" y1="175.0" x2="1190.0" y2="197.0" stroke="#1f4e79" stroke-width="4"/>

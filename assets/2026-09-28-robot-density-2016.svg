<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="526" viewBox="0 0 1600 526" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Industrial robots per 10,000 manufacturing employees, 2016</title>
<desc id="desc">Horizontal bars from Korea at 631 down to Mexico at 33; China is 68 and the world average is 74.</desc>

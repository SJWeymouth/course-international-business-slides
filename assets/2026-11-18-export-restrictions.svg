<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Export restrictions enacted per year, since 2020 against 2010 to 2019</title>
<desc id="desc">A column chart of an index of export restrictions enacted per year, with the 2010 to 2019 average set to 1: 1 for 2010 to 2019; 7 since 2020, highlighted.</desc>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="10" y="46" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">EXPORT RESTRICTIONS PER YEAR, 2010-2019 = 1</text>
<rect x="158.4" y="462.9" width="260" height="57.1" fill="#041e42"/>
<text x="288.4" y="446.9" font-size="44" font-weight="700" fill="#041e42" text-anchor="middle">1</text>
<text x="288.4" y="570" font-size="34" font-weight="400" fill="#041e42" text-anchor="middle">2010 to 2019</text>
<rect x="581.6" y="120.0" width="260" height="400.0" fill="#8a7a5c"/>
<text x="711.6" y="104.0" font-size="44" font-weight="700" fill="#8a7a5c" text-anchor="middle">7</text>
<text x="711.6" y="570" font-size="34" font-weight="400" fill="#041e42" text-anchor="middle">Since 2020</text>
<line x1="40" y1="520" x2="960" y2="520" stroke="#5b6672" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Two estimates of U.S. jobs lost to or at risk from offshoring cited by Boo in 2004</title>
<desc id="desc">A chart: U.S. jobs lost to offshoring soon, according to other analyses, about 1 million; U.S. jobs at risk in the near term according to a Berkeley study, 14 million, highlighted.</desc>
<rect width="1000" height="350" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">MILLIONS OF U.S. JOBS</text>
<text x="10" y="130" font-size="32" fill="#041e42">U.S. jobs lost to offshoring soon, other analyses</text>
<rect x="10" y="146" width="44.0" height="54" fill="#041e42"/>
<text x="70.0" y="186.0" font-size="32" font-weight="400" fill="#5b6672">about 1 million</text>
<text x="10" y="260" font-size="32" fill="#041e42">U.S. jobs at risk in the near term, Berkeley study</text>
<rect x="10" y="276" width="616.0" height="54" fill="#8a7a5c"/>
<text x="642.0" y="316.0" font-size="32" font-weight="700" fill="#8a7a5c">14 million</text>
</svg>

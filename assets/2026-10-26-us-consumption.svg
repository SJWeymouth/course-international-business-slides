<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">U.S. oil consumption, supplied from home and from net imports, 1950 to 1974</title>
<desc id="desc">Stacked areas in million barrels a day. The top edge is U.S. consumption, rising from 6.5 in 1950 to 14.7 in 1970 and 17.3 in 1973. The lower band, supplied from U.S. production, rises to about 11.5 in 1970 and then stays flat; the upper band, net imports, widens from 0.5 in 1950 to 3.2 in 1970 and 6.0 in 1973. A dashed line marks 1970.</desc>
<rect width="1600" height="470" fill="#ffffff"/>
<text x="100" y="40" font-size="30" font-weight="600" letter-spacing="1.2" fill="#1f4e79">U.S. OIL CONSUMPTION, MILLION BARRELS A DAY</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Shares of world proved oil reserves in O'Sullivan's examples</title>
<desc id="desc">Horizontal bars: Iraq after taking Kuwait in 1990, one-fifth; Iraq if it had also taken Saudi Arabia, more than 40 percent; U.S. tight oil in 2015, less than 1 percent (highlighted).</desc>
<rect width="1000" height="455" fill="#ffffff"/>
<text x="10" y="46" font-size="32" font-weight="600" letter-spacing="1.2" fill="#1f4e79">SHARE OF WORLD PROVED OIL RESERVES</text>
<text x="10" y="130" font-size="34" fill="#041e42">Iraq after taking Kuwait, 1990</text>
<rect x="10" y="144" width="321.7" height="50" fill="#041e42"/>
<text x="347.7" y="181.0" font-size="34" font-weight="400" fill="#5b6672">one-fifth</text>
<text x="10" y="255" font-size="34" fill="#041e42">Iraq with Saudi Arabia too</text>
<rect x="10" y="269" width="643.5" height="50" fill="#041e42"/>
<text x="669.5" y="306.0" font-size="34" font-weight="400" fill="#5b6672">more than 40%</text>
<text x="10" y="380" font-size="34" fill="#041e42">U.S. tight oil, 2015</text>
<rect x="10" y="394" width="16.1" height="50" fill="#8a7a5c"/>
<text x="42.1" y="431.0" font-size="34" font-weight="700" fill="#8a7a5c">less than 1%</text>
</svg>

<text x="1080" y="433" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">DEMOCRATIC</text>
<text x="1080" y="465" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">POLITICS</text>

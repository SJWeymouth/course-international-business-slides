<text x="1390.0" y="153" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">BRITAIN, 2021</text>
<text x="1390.0" y="204" font-size="31" font-weight="400" fill="#041e42" text-anchor="middle">Left the single market</text>
<line x1="1200" y1="510.0" x2="900.0" y2="510.0" stroke="#5b6672" stroke-width="2.5" stroke-dasharray="7 6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">The baht collapsed after Thailand abandoned the fixed exchange rate</title>
  <desc id="desc">The exchange rate was about 25 baht per dollar before the July 2, 1997 float, 32 baht per dollar three weeks later, and about 56 baht per dollar by early 1998. A higher number means a weaker baht.</desc>
  <rect width="1400" height="570" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="120" y1="455" x2="1320" y2="455" stroke="#7088a4" stroke-width="3"/>
    <line x1="120" y1="70" x2="120" y2="455" stroke="#7088a4" stroke-width="3"/>
    <g stroke="#d8e1eb" stroke-width="2">
      <line x1="120" y1="385" x2="1320" y2="385"/>
      <line x1="120" y1="280" x2="1320" y2="280"/>
      <line x1="120" y1="175" x2="1320" y2="175"/>
      <line x1="120" y1="70" x2="1320" y2="70"/>
    </g>
    <g font-size="23" fill="#3d4b5b" text-anchor="end">
      <text x="100" y="393">25</text>
      <text x="100" y="288">35</text>
      <text x="100" y="183">45</text>
      <text x="100" y="78">55</text>
    </g>
    <text transform="translate(35 300) rotate(-90)" font-size="24" font-weight="700" fill="#041e42">Baht per U.S. dollar</text>
    <text x="1040" y="38" text-anchor="end" font-size="22" fill="#9a4a42">Higher = weaker baht</text>

    <path d="M170 385 L700 385 L820 311 L1240 59" fill="none" stroke="#041e42" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="700" y1="70" x2="700" y2="455" stroke="#9a4a42" stroke-width="3" stroke-dasharray="10 8"/>
    <g>
      <circle cx="170" cy="385" r="12" fill="#365f8a"/>
      <circle cx="700" cy="385" r="14" fill="#9a4a42"/>
      <circle cx="820" cy="311" r="12" fill="#365f8a"/>
      <circle cx="1240" cy="59" r="14" fill="#9a4a42"/>
    </g>
    <g font-size="24" fill="#041e42">
      <text x="170" y="430" text-anchor="middle">Before float</text>
      <text x="700" y="500" text-anchor="middle" font-weight="700">July 2</text>
      <text x="820" y="350" text-anchor="middle">July 25</text>
      <text x="1240" y="105" text-anchor="middle">Early 1998</text>
    </g>
    <g font-size="34" font-weight="700">
      <text x="205" y="360" fill="#365f8a">25</text>
      <text x="850" y="290" fill="#365f8a">32</text>
      <text x="1185" y="45" fill="#9a4a42">56</text>
    </g>
    <text x="700" y="545" text-anchor="middle" font-size="22" fill="#3d4b5b">Selected milestones from the case. The connecting line shows the direction of change, not daily observations.</text>
  </g>
</svg>

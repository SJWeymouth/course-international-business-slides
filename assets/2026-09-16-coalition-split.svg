<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="285" viewBox="0 0 1360 285" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Global sourcing divided the textile coalition</title><desc id="desc">Yarn spinners wanted to limit foreign yarn in U.S. fabric. Fabric mills wanted foreign yarn, and apparel firms wanted foreign fabric. Arrows show the successive inputs in the supply chain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1f4e79"/></marker></defs><rect x="20" y="35" width="380" height="88" fill="#e5ecf3"/><text x="210" y="91" text-anchor="middle" font-size="32" fill="#041e42" font-weight="600">Yarn spinners</text><text x="210" y="185" dy="0" text-anchor="middle" font-size="29" fill="#041e42">Limit foreign yarn</text><text x="210" y="185" dy="42" text-anchor="middle" font-size="29" fill="#041e42">in U.S.-made fabric</text><rect x="480" y="35" width="380" height="88" fill="#e5ecf3"/><text x="670" y="91" text-anchor="middle" font-size="32" fill="#041e42" font-weight="600">Fabric mills</text><text x="670" y="185" dy="0" text-anchor="middle" font-size="29" fill="#041e42">Buy lower-cost</text><text x="670" y="185" dy="42" text-anchor="middle" font-size="29" fill="#041e42">foreign yarn</text><rect x="940" y="35" width="380" height="88" fill="#e5ecf3"/><text x="1130" y="91" text-anchor="middle" font-size="32" fill="#041e42" font-weight="600">Apparel firms</text><text x="1130" y="185" dy="0" text-anchor="middle" font-size="29" fill="#041e42">Buy competitively</text><text x="1130" y="185" dy="42" text-anchor="middle" font-size="29" fill="#041e42">priced foreign fabric</text><path d="M415 80L467 80" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/><text x="440" y="28" text-anchor="middle" font-size="22" fill="#1f4e79">Yarn</text><path d="M875 80L927 80" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/><text x="900" y="28" text-anchor="middle" font-size="22" fill="#1f4e79">Fabric</text></svg>
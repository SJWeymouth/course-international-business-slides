<title id="title">Oil's share of primary energy, world 1900 to 2025 and United States 1965 to 2025</title>
<desc id="desc">Two lines in percent. The world line rises from 3 percent in 1900 to 27 in 1950 and a peak of 51 in 1973, highlighted, then falls to 41 in 1990 and 33 in 2025. The United States line starts at 46 in 1965, peaks at 50 in 1978, and is 39 in 2025.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Diamond delivery precedes payment" font-family="Source Sans Pro, Arial, sans-serif">
<title>Diamond delivery precedes payment</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52749a"/></marker></defs><text x="35" y="40" font-size="25" fill="#1f4e79" font-weight="600">A TYPICAL CREDIT SALE IN BERNSTEIN’S ACCOUNT</text><rect x="35" y="105" width="350" height="225" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="59" y="153" font-size="28" fill="#1f4e79" font-weight="600">SELLER</text><text x="59" y="205" font-size="31" fill="#041e42" font-weight="400">Delivers the stone</text><text x="59" y="246" font-size="31" fill="#041e42" font-weight="400">Extends trade credit</text><rect x="1005" y="105" width="360" height="225" fill="#f5f3ef" stroke="#b3ada4" stroke-width="2"/><text x="1029" y="153" font-size="28" fill="#1f4e79" font-weight="600">BUYER</text><text x="1029" y="205" font-size="31" fill="#041e42" font-weight="400">Cuts or resells it</text><text x="1029" y="246" font-size="31" fill="#041e42" font-weight="400">Payment due in</text><text x="1029" y="287" font-size="31" fill="#041e42" font-weight="400">30 or 60 days</text><path d="M405 160 L980 160" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="540" y="140" font-size="33" fill="#041e42" font-weight="400">Diamonds now</text><path d="M985 277 L410 277" stroke="#52749a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="520" y="252" font-size="33" fill="#041e42" font-weight="400">Payment later</text><text x="35" y="410" font-size="32" fill="#041e42" font-weight="400">The seller’s money is tied up while the buyer creates value.</text></svg>